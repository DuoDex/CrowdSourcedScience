@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        KerbinSrfLanded* = The Kerbal holds a paper strip into the breeze, then shields it with a hand. It flutters freely outside the shelter and hangs still in the lee.
        KerbinSrfSplashed* = A wooden bead and a cork are set on the water beside the capsule. Both bob with the waves, but the bead rides lower and takes on a darker sheen.
        KerbinInSpaceLow* = A tiny globe is spun beside Kerbin. With almost nothing to slow it, the painted continents keep blurring past while the real blue-and-white world rolls slowly beneath the experiment.
        KerbinFlyingLow* = With the kit clipped beside the hatch, an astronaut exposes two short threads to the airflow. One lies along the frame while the other flickers behind a small obstruction, making a compact demonstration of a turbulent wake.
        KerbinFlyingHigh* = The astronaut unfolds a paper vane inside the secured test guard during high flight. Its response becomes easier to see when the guard is turned toward the flow; the fold itself proves less cooperative during packing.
        KerbinInSpaceHigh* = A ball tapped inside the clear box crosses the marked grid and rebounds from its far wall. Kerbin curves below the astronaut while the ball continues its private journey, losing a little speed with each collision.
    }
}
