@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        MinmusSrfLanded* = From Minmus's smooth flats to the nearby slopes, the pressure reading never leaves zero. The landscape resembles frozen scenery from home; the missing air firmly spoils that comparison.
        MinmusSrfLandedHighlands* = Minmus's highland station reads at vacuum, while a sealed calibration chamber on the same unit holds pressure as expected. The paired runs confirm both the port and display are behaving.
        MinmusSrfLandedMidlands* = At the Midlands site, a long shadow crossing the pale terrain cools the instrument and shifts its raw zero. Once corrected for temperature, the barometer remains at the vacuum baseline.
        MinmusSrfLandedLowlands* = On the Minmus lowlands, the pressure trace settles near zero after the instrument's warm-up pulse. The pale horizon is still and sharp; even the sensor's tiny baseline drift is easier to spot than any atmospheric signal.
        MinmusSrfLandedFlats* = The barometer stays quiet on the Flats. We repeated the reading after brushing frost-like grains from the inlet guard, and the result was unchanged: Minmus offers no measurable air column here.
        MinmusSrfLandedGreatFlats* = A sunlit panel warms the casing, but the compensated pressure channel remains pinned to its vacuum baseline across the Great Flats. The stable control helps separate instrument heating from any real gas pressure.
        MinmusSrfLandedGreaterFlats* = We took three readings across the Greater Flats, pausing after each small lander adjustment. None showed a gas-pressure rise; the broad pale plain gives the team a particularly clean airless reference.
        MinmusSrfLandedLesserFlats* = The barometer's inlet points toward a shallow terrace on the Lesser Flats. A brief warm-up offset fades, then the sensor returns to vacuum baseline, with no local gas pocket revealed by the sheltered position.
        MinmusSrfLandedPoles* = At the Minmus poles, frost-bright ground and deep shadow alternate around the instrument. The pressure channel stays at its airless baseline through both exposures, while the casing temperature changes more noticeably.
        MinmusSrfLandedSlopes* = The sensor was leveled twice on the Slopes after the first reading drifted during setup. Once the tripod stopped settling, the barometer held at vacuum baseline; the incline had not hidden an atmosphere.

        MinmusInSpaceLow* = Minmus's pale green flats and slopes slide under the probe. The barometer reads zero; the changing terrain makes a fine map, but no pressure signal.

        MinmusInSpaceHigh* = High above Minmus, the barometer records the spacecraft's vacuum environment throughout the pass. A sealed reference cell remains steady as the pale flats rotate below, confirming the inlet is behaving normally.
    }
}
