@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    %RESULTS
    {
        MinmusSrfLanded* = The readings confirm what you've suspected for some time - Minmus is a small moon with weak gravity.

        MinmusSrfLandedHighlands* = The sensor readings indicate that this would be an excellent location for a bouncy castle.

        //MinmusSrfLandedMidlands* =
        //MinmusSrfLandedLowlands* =

        MinmusSrfLandedFlats* = You notice the gravity scans have been saying 666 over and over again.

        MinmusSrfLandedGreatFlats* = The gravity readings dash your hopes - based on its size, Minmus is far too dense to be made of ice cream.

        MinmusSrfLandedGreaterFlats* = Despite assurances from mission planners that the readings here would be off the charts, the sensor refuses to register anything higher than "rather weak" gravity.

        MinmusSrfLandedLesserFlats* = The readings are conclusive: What goes up will take a fairly long time to come down.

        MinmusSrfLandedPoles* = The gravity scan answers a question you came up with while eating breakfast this morning - yes, Minmus really is lighter than the Mun.

        MinmusSrfLandedSlopes* = The sensor is picking up a lateral gravity gradient... Oh wait, it's just the tilt of the slope. Why did we land here again?

        MinmusInSpaceLowHighlands* = Above the highlands, the profile breaks into a series of nearby bumps matching the rugged terrain. The signal quickly smooths between rises.
        MinmusInSpaceLowMidlands* = Above the midlands, the signal lies between broad plains and the irregular highland edges. The record shows a gradual change in the profile beneath the flight path.
        MinmusInSpaceLowLowlands* = Over the lowlands, the instrument shows a broad depression that gently rises toward the midlands. The curve changes slope without sharp isolated peaks.
        //MinmusInSpaceLowFlats* =
        MinmusInSpaceLowGreatFlats* = Over the Great Flats, the gravity curve stretches into a broad, level plateau. Its edges show gentle transitions to the surrounding terrain.
        MinmusInSpaceLowGreaterFlats* = The pass over the Greater Flats yields a long, nearly level stretch of the graph. Near the end, the profile gradually bends toward higher terrain.
        MinmusInSpaceLowLesserFlats* = Over the Lesser Flats, the scanner records a compact, level patch surrounded by steeper slopes. The biome boundary stands out more clearly than the center.
        MinmusInSpaceLowPoles* = Above Minmus's poles, a narrow bend interrupts the smooth gravity trace. Another pass under different lighting should help compare the reading with the terrain.
        MinmusInSpaceLowSlopes* = Over the slopes, the gravity curve tilts along the uneven terrain and gradually levels near the lower boundary. The transition is continuous, without a step.

        MinmusInSpaceHigh* = Sadly, the readings indicate that Minmus is far too dense to be composed of mint ice cream.

        //MinmusInSpaceHighHighlands* =
        //MinmusInSpaceHighMidlands* =
        //MinmusInSpaceHighLowlands* =

        MinmusInSpaceHighFlats* = The needle doesn't seem to be moving. You're unsure whether this means that the instrument isn't working, or that the gravity is very, very weak.

        //MinmusInSpaceHighGreatFlats* =
        //MinmusInSpaceHighGreaterFlats* =
        //MinmusInSpaceHighLesserFlats* =
        //MinmusInSpaceHighPoles* =
        //MinmusInSpaceHighSlopes* =
    }
}
