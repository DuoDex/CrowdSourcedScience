@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        MinmusSrfLanded* = A small marble is rolled across a Minmus flat. It travels farther than expected in the light local gravity before a shallow ridge stops it.
        MinmusInSpaceLow* = A pale bead is released beside Minmus. It drifts gently away while the mint-colored flats slide beneath the Kerbal's boots and the craft.
        MinmusInSpaceHigh* = The kit's captive spheres collide and exchange motion above distant Minmus. Repeating the trial with a soft pad between them changes the rebound, leaving the astronaut with two distinctly different traces to compare.
    }
}
