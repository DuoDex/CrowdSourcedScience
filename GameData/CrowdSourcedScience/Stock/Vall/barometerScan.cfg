@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        VallSrfLanded* = The barometer reads zero on Vall's icy ground. The team notes the vacuum baseline beside the blue terrain, then packs up before the view distracts everyone again.
        VallSrfLandedPoles* = Vall's polar shadow leaves the hardware slow to equilibrate, but the pressure channel remains at vacuum baseline after its thermal correction. No gas pressure accompanies the blue-white ground, even in the sheltered hollow.
        VallSrfLandedMidlands* = Across Vall's Midlands, a few grains tick against the inlet guard during deployment, then the trace settles to zero. The brief disturbance came from landing dust, not a change in the surrounding pressure.
        VallSrfLandedHighlands* = The highland barometer takes a little longer to stabilize in the cold shade, then holds a clean vacuum reading. Its paired calibration channel stays steady while the bright ridge line warms in sunlight.
        VallSrfLandedLowlands* = A second lowland reading matches the first after the instrument is turned away from the lander's warm exhaust area. Vall's surface remains airless, and the repeat confirms the earlier deployment transient has passed.
        VallSrfLandedNortheastBasin* = In the Northeast Basin, the barometer records no gas pressure after a short settling interval. The basin walls frame the view, but the sensor trace is indistinguishable from the exposed flats beyond them.
        VallSrfLandedNorthwestBasin* = The Northwest Basin's sensor begins with a small installation offset; a control chamber shows the same shift. After correction the inlet stays at vacuum baseline, a useful reminder that not every blip is Vall's doing.
        VallSrfLandedSouthernBasin* = The pressure port faces the Southern Basin floor and remains quiet through the observation window. A shaded reference run produces the same flat trace; the long wait mostly tests the crew's patience.
        VallSrfLandedSouthernValleys* = A lander settling pulse briefly shakes the barometer mount in the Southern Valleys, but the gas-pressure trace does not follow it. Once the vibration fades, the near-vacuum baseline is steady again.
        VallSrfLandedMountains* = On Vall's Mountains, the exposed inlet and the one tucked behind the instrument shield both report vacuum. The comparison suggests the ridge offers no measurable gas shelter, despite its sharp relief.

        VallInSpaceLow* = Vall's blue ice glints beneath the low-orbit probe. The barometer remains at zero: Jool's icy moon has no atmosphere here for the sensor to register.

        VallInSpaceHigh* = The spacecraft's barometer remains at vacuum baseline in high orbit around Vall. As the moon crosses beneath the vehicle, a small sensor offset follows the instrument's own temperature cycle, not the surface.
    }
}
