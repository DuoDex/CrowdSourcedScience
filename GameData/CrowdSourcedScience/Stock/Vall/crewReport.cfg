@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
    %RESULTS
    {
        VallSrfLanded* = Quakes rattle tools and loose gear every few minutes.

        VallSrfLandedPoles* = From the cabin, the poleward terrain looks like a blue-white field scored by narrow dark seams. The crew can pick out no dust plume or haze, only hard sunlight and crisp shadows.

        VallSrfLandedMidlands* = You note that Vall is "Cold, desolate... lonely." Mission Control tells you to quit being so melodramatic.

        VallSrfLandedHighlands* = You can't wait to go outside. It looks so beautiful!

        VallSrfLandedLowlands* = Everything in the ship just bounced, that was one heck of a quake!

        VallSrfLandedNortheastBasin* = The basin rim cuts a low arc across the window, while the floor's pale ice makes distance difficult to judge. The lander sits level enough for the crew to compare the basin walls without a drifting horizon.
        VallSrfLandedNorthwestBasin* = A jagged band of ridges frames the northwest basin. From inside, the crew watches the sharp shadows crawl across the ice as Vall turns, a slow clock with no clouds to soften its marks.
        VallSrfLandedSouthernBasin* = The broad southern hollow fills most of the view, its far edge softened only by distance. A loose tool in the cabin barely shifts when the crew settles into their seats.
        VallSrfLandedSouthernValleys* = Several pale valley channels converge below the window, each throwing a thin shadow across the floor. The crew's apparent sense of slope changes with the overlapping ridgelines.
        VallSrfLandedMountains* = The mountain skyline breaks into bright crests and nearly black clefts. From the cabin, the crew can see how little sunlight reaches the sheltered faces, though the rocks themselves remain out of reach.

        VallInSpaceLow* = Staring out the window, you realize how blue the moon is.
        VallInSpaceLow* = The surface looks broken by eons of geological activity.
        VallInSpaceLow* = As you stare, something stirs inside you. You make a note to cook your food more carefully next time.

        VallInSpaceHigh* = As you take your notes, you notice that Vall can fit in the hole of your clipboard.
        VallInSpaceHigh* = You can swear you saw a black formation near the south pole, but you lost it before you could grab the binoculars.
        VallInSpaceHigh* = The moon is a beautiful mosaic of blue and white.
        VallInSpaceHigh* = You wonder why this moon’s inclination is exactly the same as Vall's.
    }
}
