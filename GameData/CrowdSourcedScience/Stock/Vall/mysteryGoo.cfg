@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]
{
    %RESULTS
    {
        VallSrfLanded* = The Goo oscillates once, then three times, then finally nine times.

        VallSrfLandedPoles* = Inside the canister, the Goo gathers into a squat mound while the polar ground outside stays sharply divided between sunlit ice and shadow. It slowly leans toward the bright side, then holds.
        VallSrfLandedMidlands* = The Goo forms a lopsided ring and leaves a clear center, as if the rolling midland ridges had been miniatured inside the jar. A faint shimmer crosses its rim when the lander vibrates.
        VallSrfLandedHighlands* = The specimen stretches into three blunt peaks, then slumps into a smooth bead. Outside, Vall's highland skyline echoes the Goo's peaks before the sample reshapes its miniature mountain range.
        VallSrfLandedLowlands* = The Goo spreads into a thin disk against the canister floor, then pulls itself back into a glossy knot. It repeats the motion whenever the lander settles, despite the quiet lowland plain.
        VallSrfLandedNortheastBasin* = A pale crescent appears inside the Goo, widening as the specimen creeps to one side of its container. The northeast basin's broad curved rim outside seems to have inspired the shape, somehow.
        VallSrfLandedNorthwestBasin* = The Goo develops a rough edge and a smooth center, then rotates that pattern without changing its position. The crew logs the odd symmetry against the broken outline of the northwest basin.
        VallSrfLandedSouthernBasin* = A deep dimple opens in the Goo and stays there through several lander vibrations. Its glossy little basin is a miniature twin to Vall's broad southern hollow.
        VallSrfLandedSouthernValleys* = The Goo divides into two narrow lobes joined by a shining thread. Its branching folds make a miniature valley network inside the jar.
        VallSrfLandedMountains* = The specimen raises a crooked ridge down its center, then folds it over like a soft crest. It is an uncanny match for the nearby mountain silhouette, until it slowly changes its mind.

        VallInSpaceLow* = The Goo sparkles in the dim light.

        VallInSpaceHigh* = The Goo turns blue and hard, but fluctuates internally.
    }
}
