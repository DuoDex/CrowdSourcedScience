@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
    %RESULTS
    {
        VallSrfLanded* = This reminds you of Minmus, only bubblegum flavor...
        VallSrfLanded* = You analyze the frozen surface and find some blue material.
        VallSrfLanded* = You analyze the surface and find some beautiful green and blue crystal structures.

        VallSrfLandedPoles* = After crushing some of the surface ice into a snow-cone and getting permission from mission control for an experiment, you find it doesn't taste particularly nice.

        VallSrfLandedMidlands* = The icy crystals show signs of shock and sharp temperature change at some point in the past.

        VallSrfLandedHighlands* = As you dig into the blue ice, a particularly nasty quake sends your shovel flying. Perhaps you shouldn't dig any deeper...

        VallSrfLandedLowlands* = Strangely, some of the ice on the surface seems significantly fresher than the rest.

        VallSrfLandedNortheastBasin* = The scoop returns pale, compacted grains with a few translucent chips. They hold together briefly when pressed, then crumble along the basin floor's fine fractures; composition remains undetermined.
        VallSrfLandedNorthwestBasin* = A shallow scrape yields angular blue-white fragments mixed with finer powder. Under magnification the grains have uneven edges, consistent with repeated breakage across the basin's exposed surface.
        VallSrfLandedSouthernBasin* = The southern basin specimen is a thin crust over softer granular material. A gentle compression leaves a clean mark that partly relaxes as loose grains settle around its edge.
        VallSrfLandedSouthernValleys* = The valley-floor sample contains thin flakes embedded in a gritty, pale matrix. Several pieces split along parallel planes when pressed, while the finer fraction packs into the scoop's corners.
        VallSrfLandedMountains* = This mountain specimen includes coarse chips and fine dust from between the ridges. Its fragments are visibly more angular than the basin samples, a handy comparison for the geology tray.
    }
}
