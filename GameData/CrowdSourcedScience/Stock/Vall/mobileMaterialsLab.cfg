@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]
{
    %RESULTS
    {
        VallSrfLanded* = You hear a knocking coming from the inside of the materials bay, but good judgment keeps you from investigating further.

        VallSrfLandedPoles* = Exposed foil on the materials rack contracts more than its shielded control during the polar night-facing interval. The sealed samples stay clean; the contrast records exposure, not a soil assay.
        VallSrfLandedMidlands* = The exposed polymer strip keeps its shape, but a faint pale film forms on its sun-facing edge. Its paired control remains clear, pointing to local exposure as the relevant change.

        VallSrfLandedHighlands* = You accidentally drop some ice from the lab onto the surface. You wonder if there is a way to tell the difference between Kerbin's ice and Vall's ice.

        VallSrfLandedLowlands* = A test coating on the rack develops a fine network of hairline cracks while the uncoated reference stays smooth. The result reflects Vall's surface conditions acting on lab materials.
        VallSrfLandedNortheastBasin* = The exposed metal coupon cools and contracts against its mount, leaving a narrow gap absent from the protected control. No basin grains entered the sealed laboratory chamber.
        VallSrfLandedNorthwestBasin* = A suspended powder sample settles into a compact ridge after repeated lander settling, while the sealed comparison remains loose. The rack records a mechanical response under Vall's weak gravity.
        VallSrfLandedSouthernBasin* = The test film grows cloudy near its edges but stays transparent at the center. A control sealed from the exterior remains unchanged, so the basin environment is the likely influence.
        VallSrfLandedSouthernValleys* = The flexible strip curls toward its shaded side as the rack cools, then partially straightens in sunlight. Its control bends less, capturing the valley's pronounced illumination cycle.
        VallSrfLandedMountains* = A thin coating on the exposed sample plate flakes at one corner; the covered plate retains an even surface. The lab notes a surface-condition effect without attributing it to mountain rock.

        VallInSpaceLow* = Above Vall, the reagents slowly gather into round droplets. Fine particles in the experiment cell leave a dull coating and shift their hue.

        VallInSpaceHigh* = In high orbit, the sealed powder vial stays contained while its loose particles drift freely inside during attitude changes. The experiment measures microgravity handling, not Vall's distant surface.
    }
}
