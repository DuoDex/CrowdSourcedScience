@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]
{
    %RESULTS
    {
        VallSrfLanded* = You detect some underground tremors. You decide they are caused by cryovolcanic events.

        VallSrfLandedPoles* = The footplate finds uneven contact with Vall's polar crust, and no distinct vibration rises above lander noise during this quiet interval.

        VallSrfLandedMidlands* = This data would be very valuable in advancing science if the screen hadn't iced over.

        VallSrfLandedHighlands* = The seismic scan indicates that there is a sudden density change a significant distance below the surface.

        VallSrfLandedLowlands* = Wow, what a quake! Something big must have just shifted underground.

        VallSrfLandedNortheastBasin* = Using the power of electricity, the screen shows nothing. Not even if you believe.

        VallSrfLandedNorthwestBasin* = The sensor records a few faint settling clicks as the footplate finds purchase on the basin floor, followed by a long quiet trace. Nothing here supports a precise claim about Vall's interior.
        VallSrfLandedSouthernBasin* = In Vall's southern basin, the impact pulse returns in several blurred echoes, tracing alternating dense and loose layers below the surface.
        VallSrfLandedSouthernValleys* = Across Vall's southern valleys, the seismometer records several pulses arriving at different times. The icy ground has supplied an excellent opening act for the next measurement.
        VallSrfLandedMountains* = On the mountain slope, fractured ground gives the footplate shifting contact. The passive trace records the touchdown settling and equipment noise, then quiets.
    }
}
