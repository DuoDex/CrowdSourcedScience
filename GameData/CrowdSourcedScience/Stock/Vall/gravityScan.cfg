@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    %RESULTS
    {
        VallSrfLandedPoles* = You notice the gravity scans have been saying 666 over and over again.
        VallSrfLandedPoles* = The polar reading differs slightly between the plateau and neighboring lowland; the distribution of local gravity follows the surface's large-scale forms.

        VallSrfLandedMidlands* = You notice the gravity scans have been saying 666 over and over again.
        VallSrfLandedMidlands* = At the midlands site, the local gravity response changes gradually as the equipment is moved from flat ground toward a nearby ledge.

        VallSrfLandedHighlands* = You notice the gravity scans have been saying 666 over and over again.

        VallSrfLandedLowlands* = You notice the gravity scans have been saying 666 over and over again.
        VallSrfLandedLowlands* = In the lowlands, the sensor records local gravity without a sharp jump. Repeat measurements after turning the craft give a similar profile.

        VallSrfLandedNortheastBasin* = At the bottom of the Northeast Basin, the gravity profile is steadier than at its edge. The transition to the slope appears as a gradual tilt in the readings.
        VallSrfLandedNorthwestBasin* = Readings on the floor of the northwest basin are steady. Moving the instrument toward the nearby rim shifts the curve slightly as the terrain rises.
        VallSrfLandedSouthernBasin* = At the southern basin, the instrument notes a steady field at the center and a gradual increase in response near the sloping rim.
        VallSrfLandedSouthernValleys* = On the floor of the southern valley, readings shift slightly near a side channel. The instrument detects the terrain transition without a sharp local peak.
        //VallSrfLandedMountains* =

        VallInSpaceLowPoles* = On the polar pass, the gravity curve changes over bright plateaus and lowlands. The instrument traces crustal variation rather than a single isolated mass.
        VallInSpaceLowMidlands* = Over the midlands, the instrument detects small gravity changes at the boundaries between plains and high ground. The transitions are smooth, with no isolated strong source.
        //VallInSpaceLowHighlands* =
        VallInSpaceLowLowlands* = The low plains produce a broad gravity band during the pass, without sharp peaks; the map suggests a smooth crustal profile beneath the basins.
        VallInSpaceLowNortheastBasin* = Over the northeastern basin, a weak local gravity gradient points inward; the contrast is consistent with the deep topographic bowl.
        VallInSpaceLowNorthwestBasin* = The pass over the Northwest Basin shows a smooth gravity transition from rim to center; the instrument detects no sharp local variations.
        VallInSpaceLowSouthernBasin* = Over the southern basin, a long gravity transition follows the rim; its width matches the gradual change in terrain beneath the craft.
        VallInSpaceLowSouthernValleys* = Over the southern valleys, weak variations follow the network of low areas. Individual branches are discernible, though they do not change the overall direction of gravity.
        VallInSpaceLowMountains* = Above the mountains, the gravity curve shifts slightly along the long ridges, then levels out above neighboring depressions.

        VallInSpaceHigh* = You can feel some gravity already.

