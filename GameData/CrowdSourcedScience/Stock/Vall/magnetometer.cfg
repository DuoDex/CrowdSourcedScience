@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]
{
    %RESULTS
    {
        VallInSpaceLow* = In low orbit, the magnetometer records weak signal deviations during the pass around Vall, suitable for comparison with measurements farther from the surface.

        VallInSpaceHigh* = After subtracting the spacecraft's own currents, the magnetometer traces a weak, variable field near Vall. Ambient and remanent contributions mingle in the moon's quiet magnetic record.
    }
}
