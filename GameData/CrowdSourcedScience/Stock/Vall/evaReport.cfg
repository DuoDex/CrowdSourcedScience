@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    %RESULTS
    {
        VallSrfLanded* = The ground rumbles ominously beneath you before you realize that you're just hungry.
        VallSrfLanded* = Ice crystals look very shiny.
        VallSrfLanded* = You wish you'd brought your ice skates.
        VallSrfLanded* = Ice melts down and evaporates from the friction of your space boots. You concentrate very hard on keeping your balance.

        VallSrfLandedPoles* = The rocks are of a bluish-green color... Pretty!

        VallSrfLandedMidlands* = The surface shivers as the deeper crust buckles and fractures. You want badly to get back inside the ship now.

        VallSrfLandedHighlands* = The ground beneath you suddenly lurches, and you hear the sound, carried up through your feet, of immense ice plates scraping against each other.

        VallSrfLandedLowlands* = Well, the ice is... thick. You wonder if there's a frozen waterfall somewhere.

        //VallSrfLandedNortheastBasin* =
        //VallSrfLandedNorthwestBasin* =
        //VallSrfLandedSouthernBasin* =
        //VallSrfLandedSouthernValleys* =
        //VallSrfLandedMountains* =

        VallInSpaceLow* = You look at all the valleys and wonder what made them that way.

        VallInSpaceLowPoles* = Vall's polar regions are brighter than its equatorial regions. From outside the craft, blue-green surfaces alternate with long shadows that emphasize the raised icy terrain.
        VallInSpaceLowMidlands* = From orbit, Vall's midlands look smooth, but fine fracture lines cross them; pale ice patches accentuate the terrain.

        VallInSpaceLowHighlands* = Closer investigation of the planet makes you think of Minmus. You are once again hungry for mint dessert.

        //VallInSpaceLowLowlands* =
        VallInSpaceLowNortheastBasin* = The northeastern basin forms a broad arc surrounded by brighter ledges. From orbit, its edges visibly cross older valleys.
        VallInSpaceLowNorthwestBasin* = The Northwest Basin looks like several nested bowls: its smooth floor gives way abruptly to a ring of rugged slopes.
        VallInSpaceLowSouthernBasin* = The southern basin has a smooth inner floor and a broken rim. Isolated ridges along the edge look as if they have raised the icy crust.
        VallInSpaceLowSouthernValleys* = The southern valleys converge on low ground and branch into channels; their winding pattern shows clearly against the pale ice.
        VallInSpaceLowMountains* = Vall's mountain ranges cast long shadows across icy plains. In the suit, you find yourself looking for a convenient route between the ridges.

        VallInSpaceHigh* = You see a sparkling stream of crystals blast into the sky in the distance.
    }
}
