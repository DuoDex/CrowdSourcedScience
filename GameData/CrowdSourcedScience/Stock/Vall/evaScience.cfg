@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        VallSrfLanded* = A dark bead is set on Vall's pale icy ground and pushed gently. It slides a short way, leaving a faint line before stopping at a rough patch.
        VallInSpaceLow* = A clip on the kit is opened above Vall. A loose bead drifts out instead of falling onto the tray; the icy moon rolls beneath an experiment with no useful down direction.
        VallInSpaceHigh* = A sealed pouch is kneaded to divide one liquid blob into several smaller ones. They merge when brought together again, while Vall's pale reflected light makes their curved boundaries easy to follow through the clear wall.
    }
}
