@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    %RESULTS
    {
        VallSrfLanded* = After scraping flecks of ice off the meter, you confirm that yes, it is indeed very cold out.

        VallSrfLandedPoles* = Near Vall's poles, the surface remains cold even in sunlight; the sensor records only small differences between outcrops and shaded hollows.
        VallSrfLandedMidlands* = On the midlands, the sensor records strong cooling at the exposed surface; beneath a thin ice crust, the probe briefly retains warmth below the surface.

        VallSrfLandedHighlands* = There is a section below the surface that has a surprisingly high temperature for Vall. Being Vall, of course, it's still quite cold.

        VallSrfLandedLowlands* = The sensor warms in direct sunlight and cools steadily after the lander's shadow crosses it. With no air to buffer the change, the lowland surface shows a sharp response to illumination.
        VallSrfLandedNortheastBasin* = The Northeast Basin floor warms more evenly than the surrounding ledges, but readings drop sharply at the shadowed edge.
        VallSrfLandedNorthwestBasin* = In the northwest basin, the scanner finds cold strips in the rim's shadow and warmer patches on the open floor.
        VallSrfLandedSouthernBasin* = On the southern basin floor, temperature changes gradually until the probe reaches the wall: there, longer-lasting shadow leaves the surface colder.
        VallSrfLandedSouthernValleys* = In the southern valleys, shaded grooves stay cold beside sunlit areas. Readings change over short distances with the terrain.
        VallSrfLandedMountains* = On the mountain slopes, sunlit outcrops are warmer than shaded crevices. The sensor cools fastest where a neighboring ridge blocks the surface.

        VallInSpaceLow* = It's incredibly cold, but every now and then the temperature rises. Plumes of heat must be coming off the moon below.

        VallInSpaceHigh* = In high orbit, the thermometer's reading shifts with its exposure to sunlight and the spacecraft's shadow. It is tracking radiative balance, since empty space supplies no ambient air temperature.
    }
}
