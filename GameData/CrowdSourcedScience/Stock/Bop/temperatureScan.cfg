@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    %RESULTS
    {
        BopSrfLanded* = Bop is trying to mislead your temperature readings. Or maybe it's not Bop, but something that lives on Bop?

        BopSrfLandedPeaks* = The thermometer reads 66.6 degrees Celsius. That... that can't be right.

        BopSrfLandedRidges* = A sunlit ridge crest warms the sensor faster than the neighboring shadowed slope, then cools as the lander blocks the light. On airless Bop, the thermometer catches the sharp change directly.

        BopSrfLandedPoles* = Bop's temperature seems highly suspect...

        BopSrfLandedSlopes* = On Bop's slope, the contact thermometer slowly settles on the surface temperature. Its reading shifts slightly when moved into shadow.
        BopSrfLandedValley* = In Bop's valley, the sensor records the rock's temperature after brief contact. The slope's shadow keeps the readings steady.

        BopInSpaceLow* = The orbital temperature sensor changes its reading as the craft passes from sunlight into shadow. Bop's small, uneven disk slips beneath it.

        BopInSpaceHigh* = Bop's distant disk slips in and out of the spacecraft's view as the exposed probe heats and cools. The instrument tracks its own radiative balance in vacuum as the craft turns.
    }
}
