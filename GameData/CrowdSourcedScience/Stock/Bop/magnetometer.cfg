@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]
{
    %RESULTS
    {
        BopInSpaceLow* = The field direction drifts during the low pass around Bop. The team marks the craft's attitude changes alongside the trace before deciding whether any small residual signal belongs to the moon.

        BopInSpaceHigh* = Far from Bop, the magnetometer trace settles into a useful space-background reference. The closer pass is queued up to give the tiny moon its turn in the spotlight.
    }
}
