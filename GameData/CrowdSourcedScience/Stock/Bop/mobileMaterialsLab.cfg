@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]
{
    %RESULTS
    {
        BopSrfLanded* = The materials are getting a little freaked out, which in turn freaks you out. Bop is truly an evil place.

        BopSrfLandedPeaks* = You think you see a small tentacle, but the video flickers, and it's gone.

        BopSrfLandedRidges* = The materials appear to have set up a new facist government, and are attemping to invade a nearby fuel tank.

        BopSrfLandedPoles* = The lab exposes a small metal coupon on Bop's poles while a matched piece remains sealed. The exposed sample develops a faint dull patch, a controlled material response rather than a soil analysis.
        BopSrfLandedSlopes* = A test fiber inside the lab contracts slightly during exposure on Bop's steep slopes. Its protected comparison stays straight, and the experiment keeps all material enclosed away from the loose ground.
        BopSrfLandedValley* = The exposed film in the materials lab gathers into a shallow curl beside Bop's sheltered valley. The control stays flat, allowing the crew to compare the change without sampling local dust.

        BopInSpaceLow* = You open the doors and notice something small and green. The scientists said they lost a radioactive squid the other day. You hope this won't affect your journey home.

        BopInSpaceHigh* = In high orbit above Bop, the lab's enclosed grains drift freely when the craft changes attitude. A coated control remains fixed in its holder, illustrating how exposure and orientation affect the test materials.
    }
}
