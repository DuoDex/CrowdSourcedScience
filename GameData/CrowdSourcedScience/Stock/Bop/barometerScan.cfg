@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        BopSrfLanded* = The barometer reads zero on Bop's uneven ground. Its feet need careful placement among the ridges; the needle, at least, has no reason to wobble.
        BopSrfLandedPeaks* = At Bop's Peaks, the barometer is braced against a jagged outcrop and allowed to settle. The inlet remains at vacuum while the irregular horizon swings slightly as the lander's suspension relaxes.
        BopSrfLandedRidges* = A repeat scan along Bop's Ridges gives the same near-zero pressure after the sensor is leveled on a second foothold. The readings match across both placements on the steep little moon.
        BopSrfLandedPoles* = Bop's polar shadow cools the instrument head and shifts its uncorrected zero. The sealed reference registers the same drift, and the corrected inlet settles back at vacuum baseline.
        BopSrfLandedSlopes* = The pressure port faces downslope at Bop, then is rotated uphill for a second check. Both readings remain at vacuum while the footplate wobbles on the moon's steep footing.
        BopSrfLandedValley* = Dust kicked from beneath a lander footpad briefly reaches the inlet in Bop's Valley. After the particles clear, the pressure trace settles to vacuum baseline on the repeat run.

        BopInSpaceLow* = Bop's lumpy, brown disk slips beneath the probe. The barometer stays at zero; the little moon offers plenty to look at, but no atmosphere to press on the sensor.

        BopInSpaceHigh* = The barometer tracks the spacecraft's own thermal cycle in high orbit around Bop; its sealed reference shifts in parallel. The gas inlet stays at vacuum as the moon's lumpy outline turns below.
    }
}
