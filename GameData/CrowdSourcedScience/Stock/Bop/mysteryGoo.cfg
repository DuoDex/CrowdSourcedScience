@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]
{
    %RESULTS
    {
        BopSrfLanded* = You ponder what the Goo is. Only here have you ever thought this.

        BopSrfLandedPeaks* = The Goo turns into an odd, green-colored ball.

        BopSrfLandedRidges* = The Goo stretches into a narrow ridge inside its canister, then wrinkles along the crest. The crew tilts the vessel beside Bop's jagged terrain and watches the lump slowly slump.

        BopSrfLandedPoles* = The Goo isn't doing well.

        BopSrfLandedSlopes* = The Goo slides to one end of its container and holds there in a lopsided mound. It trembles after the crew levels the canister, echoing the uneasy slope outside without escaping.
        BopSrfLandedValley* = The Goo flattens across the base of its container and gathers into a small central bead. The crew turns toward the sheltered valley; the sample responds with another slow, glossy fold.

        BopInSpaceLow* = The Goo has assumed a greenish shape with multiple extrusions.
        BopInSpaceLow* = The Goo feels very uncomfortable.
        BopInSpaceLow* = The Goo seems agitated and attempts to escape its container.

        BopInSpaceHigh* = The Goo seems to try to get your attention.
        BopInSpaceHigh* = The Goo bops you playfully on the head.
    }
}
