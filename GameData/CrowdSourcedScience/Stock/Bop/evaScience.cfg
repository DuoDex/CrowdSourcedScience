@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        BopSrfLanded* = A shiny button is placed on a pebble and nudged. It skips farther than expected in Bop's faint grip, then settles against a crag with a tiny metallic wink.
        BopInSpaceLow* = A top hat and wand float beside Bop's dark little disk. The Kerbal gives the hat a gentle spin; it pirouettes while Bop's lumpy horizon turns below.
        BopInSpaceHigh* = A tiny bubble in the kit's sealed vial acts as a curved lens, bending Bop's already crooked outline. Rotating the vial changes the distortion, while the distant moon remains reassuringly the same shape.
    }
}
