@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        EelooSrfLanded* = Beside a crack in Eeloo's icy crust, the pressure trace stays flat. Moving the inlet nearer the exposed brown ground produces the same zero: surface color is not an atmosphere.
        EelooSrfLandedPoles* = At Eeloo's poles, the shaded inlet cools slowly and briefly drifts before thermal correction settles it. The final trace is vacuum, while the frost-bright terrain remains visible beyond the sensor mast.
        EelooSrfLandedNorthernGlaciers* = The barometer is planted beside the Northern Glaciers and checked again after the lander vibration stops. Both traces match at vacuum baseline beneath Eeloo's icy skyline.
        EelooSrfLandedLowlands* = A sunlit sensor and a duplicate kept beneath the lander skirt agree on Eeloo's lowlands once their temperature offsets are removed. Both settle at vacuum, leaving the local contrast in the terrain itself.
        EelooSrfLandedHighlands* = The highland port's first seconds show a faint landing-exhaust transient. It fades quickly, and the barometer returns to vacuum baseline as Eeloo's pale ridges emerge from the lander's shadow.
        EelooSrfLandedIceCanyons* = In the Ice Canyons, a sensor held in shade and one exposed to faint sunlight give matching pressure results after correction. Both channels hold at vacuum beneath the sheltered canyon walls.
        EelooSrfLandedCraters* = Eeloo's crater floor offers a flat place to repeat the pressure check after deployment. The inlet guard stays clear and the trace holds at vacuum across the depression.
        EelooSrfLandedMidlands* = The Midlands reading is logged twice, once before and once after the sensor housing reaches the local shade. The small zero drift disappears; Eeloo's gas-pressure result remains a quiet vacuum.
        EelooSrfLandedFragipan* = On the Fragipan, the barometer is sheltered behind the lander while its twin faces the open plain. Their corrected readings match at vacuum baseline beneath the crust's crisp shadow.
        EelooSrfLandedBabbagePatch* = A small grain lands across the Babbage Patch instrument grille and delays the first response. Once the cover is cleared, the channel settles to vacuum, unchanged by the patch's contrasting surface.
        EelooSrfLandedSouthernGlaciers* = The Southern Glaciers remain in deep shade during the test. The barometer's thermal correction takes longer than on the sunlit approach, but the final gas-pressure trace is still at vacuum.
        EelooSrfLandedMuGlacier* = At Mu Glacier, the lander is turned so the pressure inlet faces away from a warm equipment panel. The readings before and after the turn agree once corrected, confirming the earlier offset was thermal.

        EelooInSpaceLow* = Eeloo's white plains and brown scars slide beneath the probe. The barometer holds at zero; even here, a little closer to the distant planet, there is no blanket of air.

        EelooInSpaceHigh* = The high-orbit barometer stays near vacuum as Eeloo passes beneath the spacecraft. Its shield warms slightly in sunlight, but the matched reference channel keeps that change out of the pressure record.
    }
}
