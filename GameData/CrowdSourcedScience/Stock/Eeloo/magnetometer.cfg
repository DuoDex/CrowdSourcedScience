{
    %RESULTS
    {
        EelooInSpaceLow* = Far from Kerbol, the boom records a small offset beside frozen Eeloo. A calibration sweep pins down the spacecraft baseline before the team plots the distant world's magnetic trace.

        EelooInSpaceHigh* = At Eeloo, the sensor records a weak magnetic variation against the surrounding space environment. The quiet trace suits this small, remote world.
