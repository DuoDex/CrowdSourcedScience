@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        EelooSrfLanded* = A colored bead is rolled across Eeloo's icy surface. It leaves a faint track in the powder and stops at a shallow ripple, like a miniature sled run.
        EelooInSpaceLow* = A silver charm is turned slowly beside Eeloo. Its glint is faint under the distant Sun, but both the toy and the planet's bright icy patches stand out against the black sky.
        EelooInSpaceHigh* = Eeloo's faint light softens the kit's shadow marks. A small lamp snaps the card into focus, giving the astronaut two tidy records: natural starlight and controlled illumination.
    }
}
