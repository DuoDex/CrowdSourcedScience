@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    %RESULTS
    {
        EelooSrfLanded* = This planetoid has a small but significant gravitational force, perfect for extreme snowball fights.

        EelooSrfLandedPoles* = At the pole, the gravimeter shows a steady profile that shifts slightly when moved across an icy ridge. The Kerbal checks that both readings repeat.
        EelooSrfLandedNorthernGlaciers* = On the northern glacier, the sensor records a steady local gravity reading and a small recurring deviation. The snow crust provides a firm mounting surface.
        EelooSrfLandedLowlands* = In Eeloo's lowlands, readings remain steady while the sensor rests on smooth ice. Small deviations appear near cracks.
        EelooSrfLandedHighlands* = Near the highlands, the instrument notes a small deviation from the background reading. The Kerbal levels its base on uneven ice and obtains a repeatable profile.
        EelooSrfLandedIceCanyons* = At the edge of an ice canyon, the gravimeter shows a gradual change in the field. The Kerbal takes a reading by the scarp, then repeats it on the floor.
        //EelooSrfLandedCraters* =
        EelooSrfLandedMidlands* = On the midlands, the gravimeter registers brief variations. After moving it to firm ground, the instrument gives a steadier sequence.
        EelooSrfLandedFragipan* = On Fragipan, the gravimeter shows a steady local gravity reading with slight drift. A Kerbal moves the sensor to the brown stripe and compares the readings.
        //EelooSrfLandedBabbagePatch* =
        EelooSrfLandedSouthernGlaciers* = On the southern glacier, the field changes gradually from firm ice to a fractured edge. A repeat measurement shows the same transition.
        EelooSrfLandedMuGlacier* = Readings at Mu Glacier shift as the instrument moves from the loose margin onto solid ice. The Kerbal saves both measurements for comparison.

        EelooInSpaceLow* = The gravity of Eeloo is relatively small, which in turn gives it a small SoI. You are happy that the guys back on Kerbin are actually skilled enough to hit an object of this size from so far away.

        EelooInSpaceLowPoles* = Over Eeloo's poles, the gravimeter detects weak variations throughout the pass, while the overall field profile remains steady.
        EelooInSpaceLowNorthernGlaciers* = Over the northern glaciers, the gravity trace changes gradually. A repeat pass allows comparison with the neighboring dark areas.
        EelooInSpaceLowLowlands* = The orbital record over Eeloo's lowlands shows a steady local gravity signal with barely perceptible changes. The instrument records no sharp jumps.
        EelooInSpaceLowHighlands* = The gravimeter records several gentle variations over Eeloo's highlands. They are spread along the pass and return to the background level.
        EelooInSpaceLowIceCanyons* = Above Eeloo's ice canyons, the gravity signal forms a shallow wave. The curve shifts smoothly as the craft crosses narrow dark fissures.
        //EelooInSpaceLowCraters* =
        EelooInSpaceLowMidlands* = Over Eeloo's midlands, the gravimeter records a steady signal with gradual changes. The orbital trace captures subtle transitions over light and dark terrain.
        EelooInSpaceLowFragipan* = Over Fragipan, the gravimeter records gradual variations in the local gravity signal. The orbital curve shifts slightly against the region's long brown stripes.
        //EelooInSpaceLowBabbagePatch* =
        EelooInSpaceLowSouthernGlaciers* = The orbital record shows a gradual field variation over the southern glaciers. The graph returns to baseline after crossing the edge of the bright surface.
        EelooInSpaceLowMuGlacier* = The field varies in small waves above Mu Glacier. The gravimeter holds a steady baseline as the bright band of ice passes below.

        EelooInSpaceHigh* = Before you left Kerbin, the program director told you of the great gravity of your mission. It is clear to you now that he exaggerated.

