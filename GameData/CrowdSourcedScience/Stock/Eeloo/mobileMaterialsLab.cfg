@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]
{
    %RESULTS
    {
        EelooSrfLanded* = A liquid canister spills onto the ground and flash freezes in place. Not very informative, but very pretty.

        EelooSrfLandedPoles* = The lab exposes one metal strip at Eeloo's pole while its duplicate remains sealed. The exposed face dulls during the cold interval; the unchanged control helps separate local exposure from handling marks.

        EelooSrfLandedNorthernGlaciers* = You look away, and some of the materials shape into a dog.

        EelooSrfLandedLowlands* = All of the materials have frozen solid, except for one which has mysteriously caught fire.

        EelooSrfLandedHighlands* = You illuminate one of the samples, and it follows the light. You play with it for a little while.

        EelooSrfLandedIceCanyons* = A strange green crystal has grown. Maybe Mission Control will know what to do with it.

        EelooSrfLandedCraters* = One of the samples goes mad and jumps out of the materials bay. He was always the weird one anyway.

        EelooSrfLandedMidlands* = Most of the materials are frozen solid.

        EelooSrfLandedFragipan* = A coated coupon and its bare control are warmed by the same weak sunlight on the Fragipan. The exposed coating develops a faint haze, giving the lab a measurable contrast without sampling the crust itself.
        EelooSrfLandedBabbagePatch* = The lab sets one test film out above Babbage Patch and keeps its twin sealed. The exposed film gathers a fine residue while the protected sample stays smooth and clear.
        EelooSrfLandedSouthernGlaciers* = On the glacier field, the lab's flexible strip stiffens while the protected comparison remains pliable. The crew records a crisp cold-response contrast in the paired materials.
        EelooSrfLandedMuGlacier* = A thin experimental coating contracts slightly during exposure beside Mu Glacier. Its unexposed control keeps its original finish, giving the crew a useful comparison under Eeloo's weak light.

        EelooInSpaceLow* = You used the science lab to assemble a miniature model of the science lab. There was a lot of downtime while waiting to get to Eeloo.

        EelooInSpaceHigh* = The samples have stopped moving. You aren't sure if this is because of the cold or the time it took to get here.
    }
}
