@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
    %RESULTS
    {
        LaytheSrfLanded* = You find particles of volcanic ash in the sand. Perhaps you should avoid eating them.
        LaytheSrfLanded* = The soil reminds you of the sand on Kerbin's beaches, but it's less dense and darker in color.
        LaytheSrfLanded* = Small pebbles you've found look to be shaped by water.
        LaytheSrfLanded* = The soil contains a lot of silica and feels very rough.
        LaytheSrfLanded* = You try to form a castle out of the soil. For science, of course.
        LaytheSrfLanded* = The soil here contains some ores that looks like cronstedtite.

        LaytheSrfLandedPoles* = Sand is all over this moon. A shame it's not warmer...
        LaytheSrfLandedPoles* = The water here is different from Kerbin, it does not freeze. Maybe there is salt in the sand?

        LaytheSrfLandedShores* = You run the sand through your fingers and suddenly feel thirsty.
        LaytheSrfLandedShores* = Skipping stones is easy here! They all go 20% further than on Kerbin.
        LaytheSrfLandedShores* = Is this..... sand?

        LaytheSrfLandedDunes* = The soil here contains no immediately identifiable organic chemicals.

        LaytheSrfLandedCrescentBay* = Thirsty from your long trip, you take a sip of the sample, only to find that it's the most awful water you ever tasted.

        LaytheSrfLandedTheSagenSea* = This sample seems to have all the basic compounds required for life.

        LaytheSrfLandedCraterIsland* = The scoop returns dark, damp grains from the crater shelf, with a few pale fragments that crumble under gentle pressure. Their mixed texture matches the broken rim underfoot.
        LaytheSrfLandedShallows* = A thin layer of fine sediment comes up from the shallows, clumping where it is wet and separating into soft grains at the edge of the tray. The visible material changes across only a few centimeters.
        LaytheSrfLandedCraterBay* = The landing site yields compact, dark grains with scattered rounded pieces. They resist the scoop at first, then break apart into a powdery smear; the crater wall remains the only safe comparison.
        LaytheSrfLandedDeGrasseSea* = The collected material from the sea platform is saturated and settles into a smooth, heavy-looking layer. A small portion spreads across the tilted tray in a slow, glossy wave.
        LaytheSrfLandedPeaks* = The peak's exposed surface provides angular fragments and coarse grit. They tumble loudly against the sample cup, while a finer fraction clings to its rim after the crew brings it back inside.

        LaytheSrfSplashed* = The liquid filling these basins seems to be different than Kerbin's.
        LaytheSrfSplashed* = The sample sticks to your suit. You wonder if Mission Control is going to charge you for the dry cleaning.
        LaytheSrfSplashed* = The liquid, though definitely water, contains impurities that seem to help it maintain a liquid state at these temperatures.
        LaytheSrfSplashed* = You manage to take a sip of local water through the oxygen supply tube. It definitely looks like water, acts like water, smells like water and... it does not taste like water at all. You hope you have medicine on the ship.

        LaytheSrfSplashedPoles* = The scoop collects a cold, wet mixture at the polar waterline, including pale grains that remain visible through the liquid. The material settles quickly in the sealed cup, without revealing what the grains contain.
        LaytheSrfSplashedShores* = At the shore, wet dark grains adhere to the scoop while drier tan particles fall away. The contrast is clear in the sealed tray, though the changing moisture makes the two portions difficult to compare.
        LaytheSrfSplashedDunes* = The dune margin contributes fine, rounded particles mixed with a small amount of dark basin sediment. After collection, the liquid drains between the grains and leaves a striped layer on the cup's base.

        LaytheSrfSplashedCrescentBay* = You go to sneak a sip of the sample, only to be nearly overwhelmed by the unpleasant odor. You spend the next few minutes recovering, wondering what possessed you to open your helmet.

        LaytheSrfSplashedTheSagenSea* = You wish you had brought a boat.
        LaytheSrfSplashedTheSagenSea* = You try a drink. It feels like a cold glacier and tastes like... well, tap water.
        LaytheSrfSplashedTheSagenSea* = You decide to put some in your bottle but it is frozen shut.
        LaytheSrfSplashedTheSagenSea* = This sample contains highly toxic levels of ammonia. Maybe you shouldn't have drank this...
        LaytheSrfSplashedTheSagenSea* = You decide to cancel your proposal for a Laythe-sourced bottled water company.

        LaytheSrfSplashedCraterIsland* = A scoop from the floating station's nearby crater margin brings up gritty material with a few smooth chips. The chips catch the light differently from the finer matrix, but their origin stays uncertain.
        LaytheSrfSplashedShallows* = The sample contains pale, fine particles from beneath the shallow water and a darker coating that disperses through the cup. The two portions settle at different rates after the sealed vessel is still.
        LaytheSrfSplashedCraterBay* = The submerged scoop returns a soft sediment that briefly clouds the collection cup before settling. Small fragments remain scattered through it, matching the nearby bay's rough crater margin.
        LaytheSrfSplashedDeGrasseSea* = A sealed collection from DeGrasse Sea holds a uniform-looking suspension that slowly clears from the top downward. The remaining fine layer resists the scoop's gentle shake, unlike the liquid above.
        LaytheSrfSplashedPeaks* = The waterline below the Peaks yields coarse fragments mixed with finer material washed from the slope. The sealed sample shows a clear size difference, though the current may have rearranged the grains.
    }
}
