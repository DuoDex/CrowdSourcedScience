@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]
{
    %RESULTS
    {
        LaytheSrfLanded* = Some of the samples spill and soak into the soil. You silently pray that the samples are sterile.

        LaytheSrfLandedPoles* = Some of the samples seem to be frozen.
        LaytheSrfLandedPoles* = Snow suddenly blows into some of the samples. You hope it doesn't effect the results.

        LaytheSrflandedShores* = The Mobile Materials Lab hums and whirs as it processes the sand you shoveled into it.
        LaytheSrfLandedShores* = One of the samples vaporized.

        LaytheSrfLandedDunes* = You put a sand-like substance into the Mobile Materials lab. It hums and whirs for some time and then it beeps. The screen says "Sand".

        LaytheSrfLandedCrescentBay* = The exposed coupons at Crescent Bay show a thin, uneven film after the humid surface interval. A sheltered control stays clean, so the lab records a local exposure effect without confusing it with shoreline material.
        LaytheSrfLandedTheSagenSea* = Material strips left in The Sagen Sea conditions curl slightly at their edges, while the sealed reference remains flat. The change is subtle but repeatable after the cabin is leveled.
        LaytheSrfLandedCraterIsland* = The crater island's sheltered air leaves a faint, patchy deposit on the outer coupon. Inside the sealed compartment the twin retains its finish, giving the crew a useful control for this exposure.
        LaytheSrfLandedShallows* = Near the shallows, the exposed test surface develops tiny beads that merge into a dull sheen. The material is part of the lab kit, and the beads make a tidy record of Laythe's humid conditions.
        LaytheSrfLandedCraterBay* = A narrow band of residue forms on the coupon facing the bay, with little change on its reverse. The contrast survives a careful repositioning, suggesting orientation matters in this humid crater setting.
        LaytheSrfLandedDeGrasseSea* = The lab's fine mesh darkens during its DeGrasse Sea exposure, then lightens as the sample dries indoors. The sealed mesh does not change, making moisture or ambient deposition likelier than handling damage.
        LaytheSrfLandedPeaks* = At the Peaks, the exposed strip contracts slightly along its length while the protected control holds its dimensions. A second cycle repeats the shift, though the change is too small to identify a cause.

        LaytheSrfSplashed* = Certain samples react explosively with Laythe's oceans. Or perhaps the sensor is reacting explosively? It's hard to tell.

        LaytheSrfSplashedPoles* = The sealed lab compartment keeps the test coupons dry despite the polar splashdown. The exposed outer panel cools and beads with moisture, while the reference material behind the window remains unchanged.
        LaytheSrfSplashedShores* = Shoreside exposure leaves a narrow wet mark on the lab's outer test plate. Its control is protected inside the unit, and neither plate contains material collected from the nearby ground.
        LaytheSrfSplashedDunes* = The test strips show a fine, sandy-looking film after the craft settles at the dune basin. It brushes away from the exposed coupon but is absent from the sealed control, consistent with local dust deposition.

        LaytheSrfSplashedCrescentBay* = The Goo seems to be afraid of water.

        LaytheSrfSplashedTheSagenSea* = It is starting to rust.
        LaytheSrfSplashedTheSagenSea* = Despite the temperature one of the samples is starting to glow hot as it touches the water.

        LaytheSrfSplashedCraterIsland* = The lab's outer coupon carries a mottled coating after the crater island splashdown. Its protected twin stays uniform, and the pattern becomes clearer when the crew turns the tray toward the cabin light.
        LaytheSrfSplashedShallows* = A thin film spreads over the exposed coupon during the shallows test, then gathers into beads as the craft rocks. The sealed control stays dry, separating the surface response from the sample tray.
        LaytheSrfSplashedCraterBay* = The outer materials panel gains a line of residue along its lower edge in Crater Bay. The same orientation shows the strongest mark after the unit is rotated, while the interior control remains pristine.
        LaytheSrfSplashedDeGrasseSea* = Repeated rocking at the sea platform moves droplets across the exposed test foil, leaving separated rings as it dries. The lab's internal standard remains untouched by this outside exposure.
        LaytheSrfSplashedPeaks* = A few pale specks adhere to the materials panel near the Peaks, collecting in scratches rather than across the smooth surface. The sealed coupon stays pristine beside the speckled one.

        LaytheFlyingLow* = The materials suddenly gather by the window, looking at the surface below.
        LaytheFlyingLow* = They look the same as they were on Kerbin.

        //LaytheFlyingHigh* =

        LaytheInSpaceLow* = The samples remain dry in the lab's sealed compartment, though Laythe's cloudy atmosphere passes outside the window. The instrument records a slight shift in the markers after shaking.

        LaytheInSpaceHigh* = In high orbit above Laythe, the exposed coupon cools unevenly as the spacecraft turns between sunlight and shadow. A shielded reference changes more slowly, highlighting the lab's thermal lag rather than any atmospheric deposit.
    }
}
