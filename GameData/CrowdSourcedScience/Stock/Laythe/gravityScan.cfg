@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    %RESULTS
    {
        LaytheSrfLanded* = You detect massive fluctuations as Jool tugs on the moon's surface.

        LaytheSrfLandedPoles* = You notice the gravity scans have been saying 666 over and over again.
        LaytheSrfLandedPoles* = Shaking the scanner does not seem to budge it. Instead you get out a golf ball and club. Gravity must be weaker than on Kerbin because you just hit it far enough for a hole in one!

        LaytheSrfLandedShores* = You notice the gravity scans have been saying 666 over and over again.
        LaytheSrfLandedShores* = At the shore, the sensor shows a gradual transition from loose sand to firmer rocky ground. The readings change over several placements.

        LaytheSrfLandedDunes* = You notice the gravity scans have been saying 666 over and over again.
        LaytheSrfLandedDunes* = On the dunes, the sensor shows a steady gradient when moved to a neighboring crest. The profile beneath the sand changes gradually, without a sharp local jump.

        LaytheSrfLandedCrescentBay* = The gravimeter settles to a steady reading at Crescent Bay while the lander rests on the shore. Rechecking after the crew levels the instrument gives nearly the same result, a useful local baseline for Laythe.

        LaytheSrfLandedTheSagenSea* = There does appear to be some gravity here.

        LaytheSrfLandedCraterIsland* = At the crater island site, the lander's tilt shifts the first gravity reading slightly. Once the feet are braced and the sensor leveled, the value steadies; the crew logs the corrected surface reference.
        LaytheSrfLandedShallows* = On the shallow seabed, the instrument detects a gentle change as it moves across a muddy patch. A thin sediment layer leaves the steady profile unobscured.

        LaytheSrfLandedCraterBay* = The gravity scan reads 69. You, for no reason at all, say "nice".

        LaytheSrfLandedDeGrasseSea* = On the floor of DeGrasse Sea, the gravimeter is slowly rotated around its support. Readings change as it is moved to nearby sediment, forming a smoothed curve.
        LaytheSrfLandedPeaks* = The gravimeter on the peak records a barely perceptible gradient as the platform turns. The clearest change aligns with the direction of a neighboring ledge.

        LaytheSrfSplashedPoles* = The floating platform rocks in polar water; after the swells ease, the average settles. A fixed point on the coastline stays in view as readings repeat across three swell cycles.
        LaytheSrfSplashedShores* = A small wave nudges the craft as the Shores reading is taken. Averaging across several seconds smooths the motion and returns a consistent surface-gravity reference for the coastal site.
        LaytheSrfSplashedDunes* = The sensor is running from a floating platform beside Laythe's dunes. Its reading repeats after the hull swings back toward shore, giving the crew a stable gravity reference across the shallow-water landing.

        LaytheSrfSplashedCrescentBay* = You notice the gravity scans have been saying 666 over and over again.

        LaytheSrfSplashedTheSagenSea* = Theinstrument shorts out before you can get an accurate reading.

        LaytheSrfSplashedCraterIsland* = With the craft bobbing beside the crater island, two short gravity runs agree once the platform's motion is averaged out. The island's dark rim frames the horizon while the instrument logs Laythe's local pull.
        LaytheSrfSplashedShallows* = The shallow water gives the platform a gentle, regular lift. After accounting for the craft's rocking, the gravimeter returns a repeatable local value, and the crew notes the calm conditions for comparison.
        LaytheSrfSplashedCraterBay* = The Crater Bay platform drifts a little during setup, then holds near the same shoreline marker. Repeated readings line up closely, showing that the floating craft has settled into a useful measurement window.
        LaytheSrfSplashedDeGrasseSea* = Long swells pass under the craft at DeGrasse Sea, so the crew waits between peaks before averaging the sensor trace. The result steadies when the hull's vertical motion quiets.
        LaytheSrfSplashedPeaks* = A jagged peak appears over the waterline as the platform rocks. The gravimeter's reading remains consistent through the slow roll, providing a broad local reference despite the dramatic shoreline backdrop.

        LaytheInSpaceLowPoles* = Your scanner shows that the gravitational draw of this moon does not change wherever you go. The water makes the planet smoother than a baby Kerbal's bottom.

        LaytheInSpaceLowShores* = You drop your pencil and it floats gently way.

        LaytheInSpaceLowDunes* = Above Laythe's dunes, a gentle ripple crosses the gravity trace. Repeat passes chart the broad regional field while the bright sand makes an excellent landmark for the next orbit.
        LaytheInSpaceLowCrescentBay* = Over the bay, the scanner's curve stretches along the arc of the shore. The transition from shallows to land appears as a broad, asymmetric feature.
        LaytheInSpaceLowTheSagenSea* = The profile over the sea forms a long, shallow dip with a slight bend near the edge. The scanner traces the basin's shape throughout the pass.
        LaytheInSpaceLowCraterIsland* = On a pass over Crater Island, the gravity profile's slope changes near the circular ledge. The central depression produces a separate, gradual dip in the trace.
        LaytheInSpaceLowShallows* = Above the shallows, the curve changes more gently than near the coastal arc, forming a broad plateau. The basin boundary appears as a gradual transition.
        LaytheInSpaceLowCraterBay* = On the low pass over Crater Bay, the gravimeter trace bends gently as Laythe pulls the spacecraft along its orbit. Tracking across the bay adds a regional sample; the craft continues smoothly over the blue surface.
        LaytheInSpaceLowDeGrasseSea* = Readings form a level band above the sea, then shift at the basin's edge. The profile suggests an extensive depression rather than a sharp isolated peak.
        LaytheInSpaceLowPeaks* = Over the peaks, the scanner records a series of narrow highs along the ridge. Between them, the signal quickly returns to the neighboring valleys' background.

        LaytheInSpaceHighPoles* = Laythe's polar cap moves across the distant disc during this high-orbit arc. The gravimeter records a smooth change in the moon's pull over time, adding another broad track to the orbital solution.
        LaytheInSpaceHighShores* = From high orbit, coastlines pass beneath the spacecraft as a shifting boundary between land and water. The measured gravity varies smoothly across the arc, giving a wide-area comparison around Laythe.
        LaytheInSpaceHighDunes* = The spacecraft's high track carries it across Laythe's dune belt. Several minutes of tracking show a gentle, repeatable gravitational curve, with the distant terrain contributing to a moon-scale average.
        LaytheInSpaceHighCrescentBay* = Crescent Bay rotates into view during a long high-orbit pass. The gravimeter's slow trend follows the changing spacecraft track, giving mission control a broad measurement across this side of Laythe.
        LaytheInSpaceHighTheSagenSea* = The spacecraft spends much of its high-orbit arc above The Sagen Sea. Laythe's pull remains evident throughout the coast, and the long track helps refine the moon-wide field against earlier passes.
        LaytheInSpaceHighCraterIsland* = Crater Island is a small mark on the blue disc below. The high-orbit gravimeter follows a broad, smooth field as the island crosses the track, adding context to Laythe's overall mass distribution.
        LaytheInSpaceHighShallows* = At this altitude the shallow-water region blends into the neighboring coast, while the gravimeter records a gradual change along the orbit. The long arc is more useful than any single moment over the bay.
        LaytheInSpaceHighCraterBay* = The Crater Bay pass begins as the spacecraft emerges from Laythe's shadow. Tracking resumes with a stable gravity curve, extending coverage of the hemisphere without singling out the bay's small features.
        LaytheInSpaceHighDeGrasseSea* = A long high-orbit segment over DeGrasse Sea gives the flight team a clean tracking arc. The gravimeter curve changes gradually as the spacecraft coasts, extending coverage of this side of Laythe.
        LaytheInSpaceHighPeaks* = The Peaks region sweeps beneath the spacecraft while the gravity record changes gradually. This distant measurement averages a broad swath of Laythe and contributes to the moon's overall orbital model.
        LaytheSrfSplashedCrescentBay* = At Crescent Bay, the floating capsule records Laythe's local gravitational pull as it rises and falls on the liquid surface. The repeated reading stays steady across the bobbing motion, a useful baseline for the shoreline survey.
    }
}
