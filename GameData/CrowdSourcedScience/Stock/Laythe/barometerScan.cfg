@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        LaytheSrfLanded* = Atmospheric pressure is lower than on Kerbin, but you don't think seasoned mountaineers would have any trouble adapting to it.

        LaytheSrfLandedPoles* = The readings are almost the same as on a sunny beach back home. It makes you feel like going for a swim.

        LaytheSrfLandedShores* = Atmospheric pressure is a bit lower than on Kerbin. You are unsure if that makes it more fun or not.

        LaytheSrfLandedDunes* = For a couple of seconds you think the device is still displaying readings taken on Kerbin.

        LaytheSrfLandedCrescentBay* = The barometer predicts rain.

        LaytheSrfLandedTheSagenSea* = The atmosphere here is unusually dense.

        LaytheSrfLandedCraterIsland* = After the crater island landing, the pressure trace climbed briefly as dust from the descent cleared, then settled into a repeatable band. A cloud shadow crossed the rim during the final reading.
        LaytheSrfLandedShallows* = Laythe's thick air gives a high, steady baseline over the shallows. A short gust pushes the trace upward, and the same bump appears again on the next pass through the open inlet.
        LaytheSrfLandedCraterBay* = The crater wall shelters the landed probe from the stronger gusts visible above the rim. Its slower pressure drift is still clear, suggesting the bay has its own calmer interval.
        LaytheSrfLandedDeGrasseSea* = A rain guard keeps spray from reaching the DeGrasse Sea station's inlet. Once the craft stops rocking, three readings agree closely despite the clouds moving overhead.
        LaytheSrfLandedPeaks* = At the Peaks, the barometer settles below the earlier shore baseline. A passing cloud bank stamps a brief dip onto the trace, giving the crew two clear signatures to compare.

        LaytheSrfSplashed* = Atmospheric pressure at sea level is quite high, but still less than on Kerbin. Well, it's a moon, give it a break!

        LaytheSrfSplashedPoles* = The floating polar station starts with a spiky trace from water flicking against the intake shield. After the shield dries, the readings smooth out and repeat through a long cloud-shadow interval.
        LaytheSrfSplashedShores* = Pressure eases upward while a broad bright patch opens over Laythe's shore, then flattens when the cloud edge passes. The instrument's inlet remains dry through the vessel's gentle bobbing.
        LaytheSrfSplashedDunes* = A dusty gust arrives from the Dunes and briefly narrows the barometer's response. The inlet clears on its own, and the next sample returns to the same steady Laythe surface baseline.

        LaytheSrfSplashedCrescentBay* = You contemplate dunking the scanner to see if it can measure depth, but Mission Control says that will void the warranty.

        LaytheSrfSplashedTheSagenSea* = The pressure seems higher over the water.

        LaytheSrfSplashedCraterIsland* = The floating sensor records a calm interval inside Crater Island, then a slow rise as clouds spill over the rim. A second run follows the same curve several minutes later.
        LaytheSrfSplashedShallows* = Two pressure samples taken after the craft settles match closely above the shallows. A third, taken during a passing squall, dips and recovers with the cloud shadow.
        LaytheSrfSplashedCraterBay* = Soft pressure oscillations repeat in Crater Bay at a slower pace than the vessel's rocking. The sheltered cove has its own gentle weather rhythm.
        LaytheSrfSplashedDeGrasseSea* = A cloud front moves across DeGrasse Sea as the barometer records a gradual pressure fall. The trend continues when the craft is steady, then levels off after the front passes.
        LaytheSrfSplashedPeaks* = At the Peaks shoreline, pressure drops during a gust from the ridge and returns as the air calms. The platform's motion is small enough that the two changes can be separated.

        LaytheFlyingLow* = The numbers are high... intriguingly high. Throw a bit more oxygen in this mix and you could live here.
        LaytheFlyingLow* = It's thin, but it's there.
        LaytheFlyingLow* = If this atmosphere had oxygen, you could take off your helmet and crack a window.

        LaytheFlyingHigh* = The air is thin and rarefied, but if you're getting readings this high up, there's a chance it gets dense enough for planes and parachutes closer to the surface.

        LaytheInSpaceLow* = Laythe's blue haze curves below the orbiting craft. The barometer remains at zero because the sensor is above the atmosphere, despite the inviting clouds in view.

        LaytheInSpaceHigh* = High over Laythe, the probe remains near its vacuum baseline through day and night portions of the orbit. Turning the spacecraft changes a slight offset, which the crew records as a calibration check.
    }
}
