@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]
{
    %RESULTS
    {
        LaytheSrfLanded* = The seismic graph is going crazy. The Joolian system seems to be subjecting Laythe to an unholy chiropractic session.
        LaytheSrfLanded* = You notice the ground starting to shake. You might want to leave soon.
        LaytheSrfLanded* = Laythe's surface stretches and flexes under the strain of tidal forces from Jool.
        LaytheSrfLanded* = The sensor is detecting heavy seismic activity deep below the surface. Perhaps Laythe has previously undetected volcanic activity. Only time will tell.
        LaytheSrfLanded* = You've set the craft right on top of a fault line! You find this both fascinating and absolutely terrifying.
        LaytheSrfLanded* = Laythe shows some very important seismic activity. You're not sure the craft can survive a tsunami, but at least it keeps the moon temperate.
        LaytheSrfLanded* = The readings fluctuate dramatically in conjunction with the waves. Perhaps it would be better to run this experiment on land.

        LaytheSrfLandedPoles* = Fluctuations within the planet's core are detected as signs of the tidal forces exerted by Jool.

        LaytheSrfLandedShores* = The detector picks up a seismic anomaly! You feel shaken.
        LaytheSrfLandedShores* = Waves breaking on the shore is interfering with the sensitivity of your instrument.

        LaytheSrfLandedDunes* = Seismic scan reports distant booms, both under the ocean and on the surface. They seem to be volcanoes.

        LaytheSrfLandedCrescentBay* = On Crescent Bay's firm landing surface, a low, irregular vibration accompanies the craft's settling. Once the supports stop shifting, the trace quiets to a steady baseline.
        LaytheSrfLandedTheSagenSea* = On the floor beneath The Sagen Sea, the coupled sensor hears a brief shudder when the lander braces take weight. The later record is subdued, with only small local motions rising above the baseline.
        LaytheSrfLandedCraterIsland* = The crater island platform transfers a short settling pulse into the seismic sensor, followed by a quiet interval. One neat landing bump, then the soundtrack drops to a hush.
        LaytheSrfLandedShallows* = Planted on the bottom below the shallows, the sensor records a faint, even tremor after deployment. A passing disturbance adds a soft pulse to the otherwise calm trace.
        LaytheSrfLandedCraterBay* = Crater Bay's bottom gives the sensor a stable coupling point once the supports stop sinking. One short arrival ripples through the trace, then the line settles nearly level.
        LaytheSrfLandedDeGrasseSea* = The seafloor sensor produces a subdued vibration record beneath DeGrasse Sea. A slow pulse coincides with the lander's final settling, so the crew separates deployment noise from the quieter later interval.
        LaytheSrfLandedPeaks* = At the Peaks, rough ground sends a few small, sharp motions through the lander as it settles. The later trace quiets, giving the crew a clean post-landing baseline.
    }
}
