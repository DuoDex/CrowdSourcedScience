@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    %RESULTS
    {
        LaytheSrfLanded* = It's quite cold here. You would definitely need some warm clothes if you were ever to walk around without your spacesuit.

        LaytheSrfLandedPoles* = Kerbol looks smaller than you remember, it is not sending much heat to the surface. Why does the water stay liquid?

        LaytheSrfLandedShores* = Is the mercury still there?
        LaytheSrfLandedShores* = The temperature is very similar to that of a refrigerator on steroids, lots of them.

        LaytheSrfLandedDunes* = Kerbol is small in the sky, but the sand is much warmer than the air. You could almost take your boots off!

        LaytheSrfLandedCrescentBay* = It's just above the freezing point of water here. A hot beverage would fit in well.

        LaytheSrfLandedTheSagenSea* = On the seafloor, the temperature remains steady as a slow current passes the probe. Fine silt settles on the cable without changing the record.
        LaytheSrfLandedCraterIsland* = On the island, the sensor warms in the open and cools in the crater rim's shadow. The casing retains heat longer than the thin probe tip.
        LaytheSrfLandedShallows* = On the shallow seabed, the temperature sensor is surrounded by clear water with a slight suspension. Readings stay steady as sunlight glints move across the casing.
        //LaytheSrfLandedCraterBay* =
        LaytheSrfLandedDeGrasseSea* = The underwater thermometer on the seafloor changes slowly; the current brings water at a steady temperature past the probe. Small bubbles cling to its cable.
        LaytheSrfLandedPeaks* = On the peak, the sensor alternates between brief solar warming and rapid cooling as cloud shadow passes. A rocky outcrop provides a cool contact point.

        LaytheSrfSplashed* = The temperatures here are below water's freezing point. Clearly, the water here has odd characteristics.

        //LaytheSrfSplashedPoles* =
        //LaytheSrfSplashedShores* =
        //LaytheSrfSplashedDunes* =

        LaytheSrfSplashedCrescentBay* = Temperatures are similar to those of Kerbin's polar regions. The water hasn't frozen, though, most probably due to the high salinity.

        LaytheSrfSplashedTheSagenSea* = You wonder why the water isn't frozen.
        LaytheSrfSplashedTheSagenSea* = The temperature is similar to being in a freezer.

        //LaytheSrfSplashedCraterIsland* =
        //LaytheSrfSplashedShallows* =
        //LaytheSrfSplashedCraterBay* =
        //LaytheSrfSplashedDeGrasseSea* =
        //LaytheSrfSplashedPeaks* =

        LaytheFlyingLow* = It's warmer near the surface. Laythe's oceans may indeed be water.

        LaytheFlyingLowPoles* = Your temperature scan shows that it is too cold to pop a window open.

        LaytheFlyingLowShores* = Kerbol is small but bright. The cockpit glass is very cold when you touch it.

        LaytheFlyingLowDunes* = Over the dunes, readings alternate with each band of bright and shaded sand. The instrument detects brief warm gusts rising from the surface.
        LaytheFlyingLowCrescentBay* = Over the bay, the temperature sensor passes through a damp layer near the water, then enters steadier airflow. Droplets on the casing evaporate slowly.
        LaytheFlyingLowTheSagenSea* = The pass over the Sagen Sea leaves faint waves on the temperature record, matching bands of cloud shadow. Water droplets collect on the sensor casing.
        LaytheFlyingLowCraterIsland* = Low over the crater, the sensor reading changes as the craft crosses its shaded rim. It detects a cooler flow near the wall and steady warming above the center.
        LaytheFlyingLowShallows* = Above the shallows, the sensor records a smoothed temperature for the humid air. Thin clouds moderate daytime heating, leaving a long, level stretch in the record.
        //LaytheFlyingLowCraterBay* =
        LaytheFlyingLowDeGrasseSea* = The low pass over the sea produces a steady temperature trace, with slight variations above the waves. Condensation on the sensor suggests humid air near the surface.
        LaytheFlyingLowPeaks* = Near the peaks, the temperature sensor passes through a cool cloud shadow, then returns to a steadier reading. The change follows the terrain, not a sharp front.

        LaytheFlyingHigh* = The temperature fluctuates more than expected.
        LaytheFlyingHigh* = The thermometer is near -40c. That's as cold as the Kerbin South Pole!

        LaytheInSpaceLow* = You forgot to cap your drink and it floated away. When you licked up the spill, your tongue froze to the radio panel. Mission Control asked if you were under attack by aliens.
        LaytheInSpaceLow* = The temperature here looks much the same as anywhere else in space, a few degrees above absolute zero.

        //LaytheInSpaceHigh* =
    }
}
