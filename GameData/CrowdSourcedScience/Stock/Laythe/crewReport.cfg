@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
    %RESULTS
    {
        LaytheSrfLanded* = You miss your family. You begin to write a postcard.

        LaytheSrfLandedPoles* = One day we will have a permanent base here. One day.

        LaytheSrfLandedShores* = It appears that we are very much on the ground right now.

        LaytheSrfLandedDunes* = You wonder if you just could sit on the beach, relax, and have a margarita.

        LaytheSrfLandedCrescentBay* = After hearing the air is breathable, you open your space helmet, only to find that breathable does not mean odorless or pleasant.

        LaytheSrfLandedTheSagenSea* = As you look out the window, you see something glowing below you. You decide it's probably best to get to shore as soon as possible.

        LaytheSrfLandedCraterIsland* = From the cabin, Crater Island's broken rim cuts a dark arc across the water. The landing legs have settled on a narrow shelf, and the view makes our level horizon look distinctly borrowed.
        LaytheSrfLandedShallows* = The shallows turn sunlight into a broad, wavering band beneath the window. Pale bottom patches give way to darker channels as the cabin rocks above the water.
        LaytheSrfLandedCraterBay* = Crater Bay's enclosing slopes make the water seem unusually still from here. A slow drift of cloud shadow crosses the rim, giving the crew a useful landmark while the craft rocks gently.
        LaytheSrfLandedDeGrasseSea* = The sea fills every window below the cloud deck, with no nearby shore to give scale. Our instruments say we are settled; our stomachs are still negotiating the small motions of the hull.
        LaytheSrfLandedPeaks* = At the Peaks, the cabin sits high above a ragged line of lower terrain. The horizon is crisp between passing clouds, and the crew can follow the island's ridges without mistaking them for waves.

        LaytheSrfSplashed* = Looking at the map of Laythe to figure out which of the islands is the closest, you know it'll be a long swim for any chance of rescue.

        LaytheSrfSplashedPoles* = A pale, low sun glints off water around the polar landing site. From the cabin the surface looks calm, but its repeated flashes make it hard to tell where the far edge of the pool meets the ice-bright shore.
        LaytheSrfSplashedShores* = The shore slides past the lower windows as the craft nudges in place. One crew member has begun calling out each strip of wet sand before it disappears under the waterline again.
        LaytheSrfSplashedDunes* = Water laps against the craft where the Dunes meet a low basin. The tawny slopes beyond it appear almost flat through the thick air, while the closest ripples distort their reflection into ribbons.

        LaytheSrfSplashedCrescentBay* = You suddenly realize that you forgot to bring your towel.

        LaytheSrfSplashedTheSagenSea* = You wish you had brought a boat.
        LaytheSrfSplashedTheSagenSea* = You thought you saw something moving in the water. Leaving the capsule might not be a good idea.

        LaytheSrfSplashedCraterIsland* = From this floating position, Crater Island's rim forms a broken ring around the bay. The crater's shadow reaches nearly to the craft, although the bright water keeps its edge easy to follow.
        LaytheSrfSplashedShallows* = The craft is afloat over the shallows, where bright bottom patches alternate with dark water. The color boundary dances beneath the window as ripples pass under the hull.
        LaytheSrfSplashedCraterBay* = The bay's steep outline is reflected in short, uneven bands around the vessel. Each time the hull turns, the same crater wall reappears from a new angle, a welcome check on our drift.
        LaytheSrfSplashedDeGrasseSea* = Only the broad surface of DeGrasse Sea is visible from this low cabin view. The crew watches a line of clouds approach across it and compares their motion with the slow roll of the floating craft.
        LaytheSrfSplashedPeaks* = The waterline cuts across the view below the Peaks, leaving the higher ridges clear above the haze. The crew can see how quickly the shoreline climbs, even as small waves hide its foot.

        LaytheFlyingLow* = Are you sure we aren't on Kerbin?

        LaytheFlyingLowPoles* = You started daydreaming about being the captain of the Space Battleship 'Spirit of Kerbin', until being woken up by a beeping sound.

        LaytheFlyingLowShores* = The ocean looks inviting. You realize that you forgot your swimsuit. Oh well, Mission Control would never have approved.

        LaytheFlyingLowDunes* = The crew deliberates heavily on the correct way to pronounce 'Laythe'.

        LaytheFlyingLowCrescentBay* = The atmosphere appears to have blocked most of Jool's radiation at this altitude. You hope your tan doesn't suffer as a result.

        LaytheFlyingLowTheSagenSea* = You look at the moon below and feel homesick.

        LaytheFlyingLowCraterIsland* = Crater Island's rim sweeps beneath the cockpit during the low pass, broken by a dark bay on one side. The thick air softens distant details, but the crater outline stays unmistakable.
        LaytheFlyingLowShallows* = From low over the shallows, pale submerged patches resolve between narrow dark channels. The crew uses their changing shape to judge our forward motion, since the cloud cover hides the usual horizon cues.
        LaytheFlyingLowCraterBay* = The low flight carries us along the bowl of Crater Bay. Its enclosing slopes make the shoreline curve away faster than expected, and the pilot calls the turn before the far rim vanishes in haze.
        LaytheFlyingLowDeGrasseSea* = The surface of DeGrasse Sea stretches beneath the cockpit, interrupted by wind-shaped bands and scattered cloud shadows. The crew keeps the instruments in view; the featureless water is a poor speed reference.
        LaytheFlyingLowPeaks* = Ridges at the Peaks rise into the low flight path, their upper faces bright and their lee sides muted by haze. The pilot adjusts early, while the crew marks the changing skyline against the clouds.

        LaytheFlyingHigh* = Readings for alpha and beta radiation are low here, but there are still elevated readings for X-Rays and gamma radiation.

        LaytheInSpaceLow* = Your radiation instruments are showing some strange results. Perhaps Laythe has a magnetic field that is interacting with Jool's.
        LaytheInSpaceLow* = You start to think how lucky you are that the Radiation Belt DLC for life isn't out yet.

        LaytheInSpaceHigh* = The radiation here must be intense. You are glad the cockpit of your spacecraft is heavily shielded.
        LaytheInSpaceHigh* = As you gaze at Laythe, you begin to wonder whether Kerbin is the only planet harboring life.
        LaytheInSpaceHigh* = As the crew look down upon Laythe, they are reminded of home and the huge distance they have traveled.
        LaytheInSpaceHigh* = You know this blue liquid can't be water. This moon is outside the habatible zone. 
    }
}
