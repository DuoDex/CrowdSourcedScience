@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    %RESULTS
    {
        LaytheSrfLanded* = You feel a slight tremor. Perhaps you should have landed on that OTHER island.
        LaytheSrfLanded* = You try to open your helmet's protective glass ever so slightly. The air is rough, humid and thin. You gasp for oxygen but there is not much to be found. Maybe Kerbals with more high-altitude experience would do just fine.
        LaytheSrfLanded* = You do a series of breathing exercises and open your helmet to try Laythian air. It feels fine but gives you a strong sense of intoxication. You decide it's because of lower oxygen content.
        LaytheSrfLanded* = After determining that the air is, if only just, breathable, you ponder whether turbojet engines would be able to run here.
        LaytheSrfLanded* = You wonder for a moment whether it would be safe or not to open the seal on your helmet. After a moment of consideration, you decide to play it safe and leave the helmet on.

        LaytheSrfLandedPoles* = Can I take off my spacesuit?

        LaytheSrfLandedShores* = Looking beyond the horizon, you conclude that this is a perfect place to set up a base for.
        LaytheSrfLandedShores* = You are glad to see the solid ground, but it seems that after such a long journey you almost forgot how to walk.
        LaytheSrfLandedShores* = This would make a great beach resort!

        LaytheSrfLandedDunes* = You wonder if you could swim to the next island from here.

        LaytheSrfLandedCrescentBay* = You feel drunk because of the thin air. Mission Control asks you to put your helmet back on.

        LaytheSrfLandedTheSagenSea* = There might be good diving on this planet. Unfortunately, Mission Control did not pack any flippers.

        LaytheSrfLandedCraterIsland* = The suit visor frames Crater Island's broken rim and a strip of water below it. Fine grit shifts under each boot, while the damp lower ground gives a darker, firmer-looking edge to the crater shelf.
        LaytheSrfLandedShallows* = Standing at the shallows, I watch wavering light patterns move across submerged patches near my boots. The suit keeps me dry as the waterline draws a clear boundary along the shore.
        LaytheSrfLandedCraterBay* = Crater Bay's steep wall rises above the landing shelf, its lower face softened by Laythe's haze. My boots leave shallow prints in dark, compact ground, and the bay's waterline bends sharply around the crater.
        LaytheSrfLandedDeGrasseSea* = There is no visible coast from this exposed platform over DeGrasse Sea, only low cloud and a muted horizon. A slight roll travels through the deck, so I brace one hand on the rail before checking my footing.
        LaytheSrfLandedPeaks* = The Peaks drop away on several sides, with cloud wisps brushing the lower ridges. My tether stays taut in the gusts, and the boots grip a rough, sloping surface rather than the smooth summit I expected.

        LaytheSrfSplashed* = You wonder if you could swim to the nearest island.
        LaytheSrfSplashed* = You realize that this is the first bath you have had since leaving Kerbin.
        LaytheSrfSplashed* = You start thinking of how cool it would be to have motorboats here. You then proceed to make motorboat sounds.
        LaytheSrfSplashed* = You attempt to drink some water. Then you remember the co-worker who died after ordering some "H2O too".
        LaytheSrfSplashed* = You tread water. Perhaps you should have chosen a drier landing spot.
        LaytheSrfSplashed* = Swimming is really hard in these suits you know.

        LaytheSrfSplashedPoles* = At the polar waterline, the light is subdued and reflected from every direction. My boots are planted on the craft's deck, not the water; the distant pale shore looks slick beneath a thin haze.
        LaytheSrfSplashedShores* = The shore's wet margin is visible just beyond the floating craft. From the ladder I can compare its darker band with the drier ground above, while the small waves repeatedly erase the boundary.
        LaytheSrfSplashedDunes* = The dune slope meets the basin at an uneven line of damp ground. From the platform I can see fine ripples across the exposed sand, but the water below keeps breaking the reflection into fragments.

        LaytheSrfSplashedCrescentBay* = The low land to water ratio and sedate water cycle of Laythe combine to give its oceans low salinity. You're forced to constantly swim to keep afloat.

        LaytheSrfSplashedTheSagenSea* = You begin to wish you'd brought a boat.
        LaytheSrfSplashedTheSagenSea* = You wonder what lies beneath this liquid, is this water?

        LaytheSrfSplashedCraterIsland* = Crater Island's rim rises around the bay like a tilted wall. The craft rocks below me, so I hold the ladder and watch the bright waterline shift against the dark inner slope.
        LaytheSrfSplashedShallows* = The shallows are clear enough to show pale patches beneath the surface from the ladder. I keep both boots on the deck and use the passing ripples to judge which way the craft is drifting.
        LaytheSrfSplashedCraterBay* = A broken crater rim encloses the bay, with one low gap opening toward distant water. The humid haze blurs the far shore, while close ripples make the craft's floating motion obvious through my legs.
        LaytheSrfSplashedDeGrasseSea* = DeGrasse Sea appears broad and nearly level from the craft's ladder, though cloud shadows travel quickly over it. I secure the handhold before leaning out; the deck shifts under each passing swell.
        LaytheSrfSplashedPeaks* = From the floating platform, the Peaks rise sharply beyond the water's edge. Their upper faces catch a brighter patch of sky, while the low shoreline is intermittently hidden by spray and haze.

        LaytheFlyingLow* = Now I really wish I had brought that parachute.

        LaytheFlyingLowPoles* = You realize that you forgot to bring sunscreen.

        LaytheFlyingLowShores* = You are sorely tempted to remove your helmet.

        LaytheFlyingLowDunes* = You feel comfortable, back at Kerbin after such a long sleep. Wait a minute...

        LaytheFlyingLowCrescentBay* = You find that changes in your environment oddly turn your thoughts rapidly from desserts towards life insurances.

        LaytheFlyingLowTheSagenSea* = It is much colder here than the scan from orbit suggested.

        LaytheFlyingLowCraterIsland* = The suit strains against the oncoming airflow, and the crater's circular rim lies below. Fine beads of moisture quickly form on the visor.
        LaytheFlyingLowShallows* = Outside the craft, the safety tether vibrates in damp airflow above the shallows. The pale bottom shows between cloud shadows as the visor catches glints of light.
        LaytheFlyingLowCraterBay* = Clipped to the external rail during the low pass, I feel Laythe's dense airflow buffet the suit and tug at my tether. The crater wall flashes past below, so the pilot keeps the maneuver short.
        LaytheFlyingLowDeGrasseSea* = The Kerbonaut grips the handrail on the outer platform; the flow above the sea tugs firmly at the safety tether. Long bands of waves glitter through the visor.
        LaytheFlyingLowPeaks* = The suit vibrates in the airflow as the craft passes above the peaks. Dark ledges cut through the cloudy haze, hiding the slopes below.

        LaytheFlyingHigh* = As you repair one of the heat shielding tiles that fell off, you are reminded of your first return through Kerbin's' atmosphere.

        LaytheInSpaceLow* = As you gaze down upon the flowing waters of Laythe, you discover that you need a toilet.

        LaytheInSpaceLowPoles* = You search the sky, hoping to see Jool.

        LaytheInSpaceLowShores* = The air looks tolerable and the water looks very inviting. A beautiful place to be!

        LaytheInSpaceLowDunes* = Your Geiger Counter is emitting a continuous hum. Time to flee.

        LaytheInSpaceLowCrescentBay* = Gazing around the landscape, you feel very homesick.

        LaytheInSpaceLowTheSagenSea* = As much as you'd like to find life, the only green wiggling creature here is in a spacesuit.

        LaytheInSpaceLowCraterIsland* = From space, the crater island looks like a dark ring amid patches of water. The handrail feels cold through the gloves, and the tether tightens as the Kerbal turns.
        LaytheInSpaceLowShallows* = The shallows appear as pale turquoise patches beneath bands of cloud. Outside the craft, only the radio link can be heard; suit straps pull taut as the Kerbal moves.
        LaytheInSpaceLowCraterBay* = Crater Bay's cloud rim drifts beneath me during the low-orbit pass, its shadow soft against the water. In free-fall, my boots stay hooked to the rail while sunlight slides across the suit's reflective arm.
        LaytheInSpaceLowDeGrasseSea* = From orbit, the sea forms a broad blue arc edged by thin clouds. The Kerbal checks the suit fastenings and catches the reflected sunlight.
        LaytheInSpaceLowPeaks* = Jagged peaks slowly turn beneath the Kerbal, sharply contrasting with smooth seas. Gloves slide on the handrail as the tether holds the spacewalker to the craft.

        LaytheInSpaceHigh* = You almost feel like you are floating above Kerbin.
    }
}
