@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]
{
    %RESULTS
    {
        LaytheSrfLanded* = The cold temperatures and thin atmosphere appear to have balanced each other out. A layer of high humidity hangs just over the water.

        LaytheSrfLandedPoles* = There's definitely some oxygen in the atmosphere, but not much. Hypoxia would set in after only a few minutes without a respirator.

        LaytheSrfLandedShores* = You are amazed by how similar the readings are to Kerbin.

        LaytheSrfLandedDunes* = The air is thinner here than on the mountain peaks!

        LaytheSrfLandedCrescentBay* = The intake filter gathers a faint damp film beside Crescent Bay. A second sample taken behind the lander's spray shield is clearer, giving the team a useful way to separate suspended droplets from the surrounding gas.
        LaytheSrfLandedTheSagenSea* = The Sagen Sea covers the analyzer's inlet in water. Fine sediment settles after landing, and the trace steadies into a clean seafloor sample.
        LaytheSrfLandedCraterIsland* = A gust across Crater Island brings a brief increase in particles trapped by the analyzer's filter. The gas reading settles sooner than the filter clears, so the two records are marked separately in the report.
        LaytheSrfLandedShallows* = Light ripples over the analyzer on Laythe's shallow seabed. Water and stirred sediment swirl through the inlet together, giving the instrument a clear liquid-contact trace.
        LaytheSrfLandedCraterBay* = Humidity at the Crater Bay intake changes as the nearby cloud bank passes. The oxygen indication persists through both samples; the crew keeps their helmets on while the rest of the mixture is checked.
        LaytheSrfLandedDeGrasseSea* = On DeGrasse Sea's floor, water and suspended grains flood the atmospheric analyzer's inlet. The scan records a lively submerged sample of Laythe's liquid and sediment.
        LaytheSrfLandedPeaks* = On the peak, the instrument draws local air through its intake. The oxygen-bearing sample has a weaker moisture trace than those collected near the sea.

        LaytheFlyingLow* = According to these readings, the air here is not, in fact, breathable. You feel satisfied knowing that you won your bet with the science department.

        LaytheFlyingLowPoles* = Black smoke, currants, cappuccino, and a hint of buttery beef.

        LaytheFlyingLowShores* = There's Oxygen, Nitrogen, Hydrogen, and lots of water. You scribble down a note: "Invest in colonization program."

        LaytheFlyingLowDunes* = The atmosphere appears to be made up of oxygen and nitrogen. You wonder at the high chlorine content, though.

        LaytheFlyingLowCrescentBay* = A low pass over Crescent Bay brings a humid sample from the coast. Oxygen appears in the spectrum alongside the stronger moisture trace near the water.
        LaytheFlyingLowTheSagenSea* = Above the Sagen Sea, each sample leaves a damp trace. Droplets collect on the intake mesh while the analyzer records oxygen in the surrounding air.
        LaytheFlyingLowCraterIsland* = Over Crater Island, the analyzer picks up moisture in the air. The trace shifts as airflow follows the crater wall.
        LaytheFlyingLowShallows* = A moist haze enters the sampler above the shallows. Oxygen appears in the spectrum, while the moisture trace changes as the craft crosses the pale water.
        LaytheFlyingLowCraterBay* = Crossing the mouth of Crater Bay produces a short pulse of moisture in the intake. On the return leg it appears near the same point, prompting the team to plot the flight track beside the gas record.
        LaytheFlyingLowDeGrasseSea* = Above DeGrasse Sea, the sampler draws in moist air and fine droplets. The oxygen-bearing mixture leaves a salty deposit on the intake mesh.
        LaytheFlyingLowPeaks* = Above the peaks, the airflow is drier than over the water, and the sample contains fewer suspended droplets.

        LaytheFlyingHigh* = The air has breathable elements, but they're very cold and very thin.

        LaytheFlyingHighPoles* = The instruments detect hydrogen escaping into space. It would seem that the source of oxygen on Laythe is photo-dissociation of its water, and not photosynthesis.

        LaytheFlyingHighShores* = The preliminary readings show an atmosphere nearly identical to Kerbin.

        LaytheFlyingHighDunes* = The atmosphere reminds you of Kerbin; although, you wonder where all the nitrogen came from.

        LaytheFlyingHighCrescentBay* = The upper-air sample over Crescent Bay takes longer to fill the analysis chamber than the surface run. Extending the collection restores a readable signal, with oxygen still identifiable among the measured gases.
        LaytheFlyingHighTheSagenSea* = Above The Sagen Sea, successive high-altitude samples contain less suspended material than the earlier low pass. The gas signal remains readable after the filter is removed from the comparison.
        LaytheFlyingHighCraterIsland* = The analyzer's high-altitude reference cycle finishes before enough outside gas has entered the chamber. A longer collection above Crater Island produces a repeatable mixture reading instead of an impressive-looking blank.
        LaytheFlyingHighShallows* = The moisture signal falls during the climb above the Shallows, even while pale water remains visible below. Repeating the sample at level flight keeps that decrease from being confused with a changing intake rate.
        LaytheFlyingHighCraterBay* = Two upper-air collections above Crater Bay agree more closely after the intake faces clear of the craft's exhaust. The first sample is retained in the log, prominently labeled as a lesson in instrument placement.
        LaytheFlyingHighDeGrasseSea* = High above DeGrasse Sea, the gas trace remains steady across a long stretch of the flight. The filter gathers little visible residue, providing a useful comparison with the wetter samples collected near the surface.
        LaytheFlyingHighPeaks* = Thin cloud wisps near the high flight over the Peaks leave a changing moisture signal. A comparison between clear and clouded portions of the track keeps that variation from being mistaken for a different bulk atmosphere.
    }
}
