@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        LaytheSrfLanded* = A feather and a paper strip are released from the same height. In Laythe's oxygen-bearing air they drift down at different rates, both tugged by a light breeze.
        LaytheSrfSplashed* = A cork is dipped beside the capsule and released. It bobs on Laythe's liquid surface as small waves wash over it; the Kerbal watches from outside.
        LaytheInSpaceLow* = A clear bead is held against Laythe's blue disk, then moved into shadow. Its outline nearly disappears against the bright, cloud-streaked world.
        LaytheFlyingLow* = The astronaut extends a narrow absorbent strip from a guarded holder during the low pass over Laythe. Damp specks appear on its exposed end; a sheltered strip is kept alongside it for comparison.
        LaytheFlyingHigh* = Clipped beside the hatch, the astronaut compares two small paddles on the kit's secured hinge. The broader paddle deflects farther in the thin airflow; both are folded away before the next bank.
        LaytheInSpaceHigh* = In a sealed demonstration tube, water creeps along a narrow channel and wets the far marker. Above Laythe's broad seas, the astronaut watches this tiny journey continue without a conventional downward drain.
    }
}
