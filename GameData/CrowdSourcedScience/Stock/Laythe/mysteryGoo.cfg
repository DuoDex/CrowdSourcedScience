@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]
{
    %RESULTS
    {
        LaytheSrfLanded* = The Goo seems excited by the climate.

        LaytheSrfLandedPoles* = The Goo seems excited. Perhaps it wants to swim in the ocean?

        LaytheSrfLandedShores* = The Goo bubbles and burps a little.

        LaytheSrfLandedDunes* = The Goo twists into strange and frightening forms, possibly due to a strong magnetic field on this moon.

        LaytheSrfLandedCrescentBay* = The Goo forms a shallow crescent against its container wall, mirroring the curve of Crescent Bay's distant shoreline. A cabin vibration briefly lifts one edge; it settles into a glossy fold before the crew can agree what moved.
        LaytheSrfLandedTheSagenSea* = Beside The Sagen Sea, the Goo gathers into a smooth dome and then slowly slumps as the platform rocks. Its surface catches the blue-green light from the water, though the color vanishes when the sample turns inward.
        LaytheSrfLandedCraterIsland* = A thin Goo strand climbs the vial near Crater Island, pauses at the same height as the dark rim outside, then slides back into a bead. The crew logs the uncanny timing beside the matching skyline.
        LaytheSrfLandedShallows* = Over the shallows, the Goo's surface breaks into bright flecks whenever sunlight moves across its container. The flecks drift independently of the craft's motion, then reunite as a single dim patch.
        LaytheSrfLandedCraterBay* = The Goo briefly holds a bowl-like depression in the Crater Bay landing module, despite having no visible solid bottom. A gentle tap sends a slow ripple around the depression, which closes from one side.
        LaytheSrfLandedDeGrasseSea* = The long roll of the floating platform makes the Goo slide toward one corner, but it returns to the center when the deck steadies. Its skin wrinkles like a miniature sea, then smooths without a lasting pattern.

        LaytheSrfLandedPeaks* = The Goo is forming shapes that mimic the terrain nearby. You conclude it likes this location.

        LaytheSrfSplashed* = The Goo is wet and cheerful.

        LaytheSrfSplashedPoles* = The Goo shivers and tries to avoid the water.

        LaytheSrfSplashedShores* = It appears that the Goo wants to do some sunbathing. Who gave it the sunscreen?

        LaytheSrfSplashedDunes* = The sample contracts into a lumpy knot while the craft floats at the edge of the Dunes basin. When the sun clears a cloud, one translucent lobe unfolds toward the window and slowly curls back.
        LaytheSrfSplashedCrescentBay* = The Goo flattens into a shining oval while the vessel floats in Crescent Bay, then draws itself into three rounded lobes. The changes continue after the deck stops rocking, so the motion is not simply slosh.

        LaytheSrfSplashedTheSagenSea* = The Goo has decided to go for a short swim.
        LaytheSrfSplashedTheSagenSea* = It bounces around from excitement... or it might be just the waves.

        LaytheSrfSplashedCraterIsland* = Near Crater Island, the Goo gathers at the vial's lower edge and makes a sharp, ring-shaped ridge. As the craft turns, the ridge rotates against the sample rather than staying aligned with the horizon.
        LaytheSrfSplashedShallows* = The Goo separates into clear and cloudy layers beside the shallows, then merges when the container is turned. No residue remains on the glass, despite a stubborn crescent clinging there during the first rotation.
        LaytheSrfSplashedCraterBay* = A ripple in the floating platform is followed by a delayed ripple inside the Goo vial. The sample's wave travels uphill along the wall before folding inward, an odd response the crew repeats twice.
        LaytheSrfSplashedDeGrasseSea* = The broad motion of DeGrasse Sea is echoed by a slow internal swirl, but the Goo's center stays fixed. A bright spot wanders around its surface and disappears whenever the vial enters shadow.
        LaytheSrfSplashedPeaks* = The Goo forms a lopsided peak as the floating craft rocks below the island slopes. Its top bends toward the cabin window, then springs back without touching the lid or leaving a mark.

        LaytheFlyingLow* = You note that the mystery goo Containment Unit is wobbling a little. Is that the Goo? Or is it just the screws coming loose?
        LaytheFlyingLow* = The Goo seems to be shivering. Perhaps the draft is making it cold?

        LaytheFlyingHigh* = There does not seem to be much activity coming from the Containment Unit. Only close examination reveals a slight pulsing.
        LaytheFlyingHigh* = The Goo is pulsing gently. It is 15% more radioactive than when in Laythe's atmosphere.

        LaytheInSpaceLow* = The Goo seems right at home in space.
        LaytheInSpaceLow* = The Goo seems comfortable.

        LaytheInSpaceHigh* = As you peek inside the Goo Containment Unit, it pops up from the bottom, surprising you.
    }
}
