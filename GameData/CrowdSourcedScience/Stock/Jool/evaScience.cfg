@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        JoolInSpaceLow* = The Kerbal spins a small striped ball beside Jool. Its bands blur together, while the gas giant's own cloud stripes remain immense and still in the distance.
        JoolFlyingLow* = Clipped to the craft, the astronaut extends a short ribbon inside the kit's guarded frame. Jool's dense flow pins it against the rear stop; the experiment is promptly folded shut with an emphatic note about restraint strength.
        JoolFlyingHigh* = The secured test frame rattles during a high pass through Jool's clouds. A small pendulum draws a tangled trace against its card, recording the buffeting much more clearly than the astronaut's handwriting does.
        JoolInSpaceHigh* = The astronaut turns a spinning wheel by its handles and feels the resistance to changing its axis. Jool rolls slowly through the background as a second trial with the wheel stopped gives a much easier turn.
    }
}
