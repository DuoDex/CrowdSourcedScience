@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]
{
    %RESULTS
    {
        JoolInSpaceLow* = During the pass, the magnetometer needle swings smoothly, then jitters in brief bursts. The record shows the gas giant changing particle flows around the craft.

        JoolInSpaceHigh* = The magnetometer traces Jool's strong, organized field, with the vector changing smoothly along the high orbit. The broad planetary field fills the pass with a clean, sweeping signature.
    }
}
