@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]
{
    %RESULTS
    {
        DresSrfLanded* = The samples are quiet. Too quiet.

        DresSrfLandedPoles* = The exposed test strip cools unevenly as its shadow shifts across the polar ground; its coated edge stays visually unchanged while the bare center dulls. The lab is testing its own material, not Dres soil.
        DresSrfLandedMidlands* = A thin film on the lab coupon contracts slightly during the midlands exposure, pulling into a fine crease near one corner. The sealed control remains smooth, separating local exposure from handling inside the module.
        DresSrfLandedLowlands* = Dust outside the lab settles on its housing, while the enclosed comparison grains remain in their trays. One exposed coating loses a little sheen after the lowland stay; no external sample has entered the experiment.

        DresSrfLandedRidges* = The samples appear to have set up a anarchist governmeant. You are not sure how you can tell.

        DresSrfLandedHighlands* = The highland exposure leaves a faint matte band on the lab's test film where it faced open sky, while the protected reference patch keeps its gloss. The module contains only prepared materials, not a soil sampler.
        DresSrfLandedImpactCraters* = After exposure on the crater floor, the lab's fine mesh holds a few grains shed from its own test pellet. The sealed comparison pellet stays intact, giving the crew a useful control for this dusty setting.
        DresSrfLandedImpactEjecta* = The vibration of landing has shifted loose test beads against one wall of the materials tray; the adhesive-coated strip retains more of them than its plain neighbor. This compares lab specimens under local conditions.

        DresSrfLandedCanyons* = The samples seem to have no reaction to the surroundings, but while examining them you think you hear a faint screaming. Is it the samples, or you?

        DresInSpaceLow* = Something must have hit the lab and mixed up all the samples. Probably a micro-meteor or some swamp gas. You had nothing to do with it.

        DresInSpaceHigh* = The objects are still floating around and making a mess, though some of them have grouped together and occasionally you see a spark between them.
    }
}
