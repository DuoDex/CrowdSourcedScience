@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]
{
    %RESULTS
    {
        DresSrfLanded* = Seismic sensors show that this dwarf planet has little geologic activity. You wonder if detonating a fuel tank would somehow remedy the situation.

        DresSrfLandedPoles* = There is a faint pulsating vibration, like a heartbeat. But it's not a heartbeat, because that would be crazy.

        DresSrfLandedMidlands* = Once the lander settles, the seismometer holds an almost silent trace on Dres's midlands. With wind out of the equation, each touchdown ring gets the whole stage.
        DresSrfLandedLowlands* = A landing shiver rolls across the lowland floor, then gives way to a long, nearly still trace. Dres has one impressively quiet seismic soundtrack.
        DresSrfLandedRidges* = The sloping ridge gives the footplate uneven contact, and touchdown rings fade quickly through it. The remaining trace sits close to the instrument's quiet baseline.

        DresSrfLandedHighlands* = You tap the ground a few times. Yep, it's on. This planet is just dead.

        DresSrfLandedImpactCraters* = A sharp touchdown pulse races through the crater floor, then fades from the passive record. For this run, the lander supplies the loudest event on the seismometer's playlist.
        DresSrfLandedImpactEjecta* = Loose ejecta muffles the lander's small settling vibration, leaving a subdued trace after deployment. The instrument records the soft contact beneath its footplate.

        DresSrfLandedCanyons* = There's no internal movement. Aside from the impacts of meteors, the needle never moves.
    }
}
