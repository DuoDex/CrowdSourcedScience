@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        DresSrfLanded* = The kit's little wind-up toy is set on Dres's dusty ground. Its feet chatter over the rough surface, tracing a crooked loop before the spring runs down.
        DresInSpaceLow* = A paper pinwheel is released beside Dres and turns slowly in the sunlight. With no breeze to drive it, each flick from the Kerbal's glove is plain to see.
        DresInSpaceHigh* = Two tethered test masses receive the same gentle push outside the hatch. The lighter one draws its cord taut first; the crew records the contrast against Dres's grey disc before carefully winding both back in.
    }
}
