@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    %RESULTS
    {
        DresSrfLanded* = You wonder if Tanya would like it here. It's much better than Tylo.

        DresSrfLandedPoles* = The pole-facing sensor responds slowly as the lander's shadow creeps over the surface, showing a strong contrast between direct illumination and shade. The reading tracks the instrument's local thermal environment.
        DresSrfLandedMidlands* = The contact sensor on Dres's midlands slowly settles to a stable reading. Rocky outcrops and shaded cracks give different measurements.
        DresSrfLandedLowlands* = In Dres's lowlands, the sensor records a steady temperature at the rocky surface. Moved into shadow, its reading shifts noticeably before gradually settling.
        DresSrfLandedRidges* = A ridge crest exposed to sunlight warms the sensor faster than the neighboring shadowed slope, then cools as the lander blocks the light. Dres has no air to smooth this sharp surface response.

        DresSrfLandedHighlands* = You think about going home soon, before Dres decides to visit the bad parts of space again.

        DresSrfLandedImpactCraters* = The crater floor's shaded reading changes little when sunlight reaches the rim, revealing how slowly the sheltered surface responds. The thermometer senses local warmth and shadow, not the crater's depth.
        DresSrfLandedImpactEjecta* = Loose ejecta around the footpads heats and cools more quickly than the lander's insulated body. The sensor registers that surface response as the Sun angle changes, with no atmosphere to retain warmth.

        DresSrfLandedCanyons* = The temperature readings are as dull and unremarkable as Dres itself.

        DresInSpaceLow* = The orbital sensor records its casing cooling as the craft enters Dres's shadow. The graph tracks the change in illumination, not the temperature of empty space.

        DresInSpaceHigh* = Far above Dres, the thermometer settles according to its own exposure to sunlight and deep space. The distant body's small disc leaves the probe's heating cycle to the spacecraft's changing orientation.
    }
}
