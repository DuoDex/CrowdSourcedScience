@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
    %RESULTS
    {
        DresSrfLanded* = You were right... it does, in fact, seem to be a giant potato.

        DresSrfLandedPoles* = The cabin view is all hard light and black shadow: the pole's shallow relief looks deceptively flat until the lander settles against a tilted patch. Our horizon is a narrow, unforgiving line.
        DresSrfLandedMidlands* = From the window, the Dres midlands break into muted grey shelves rather than a smooth plain. Small ridges interrupt the horizon, while the cabin keeps the dust safely at a distance.
        DresSrfLandedLowlands* = The lowland floor sits below a broken rim, making the nearby slopes loom higher than they looked on descent. The view suggests a sheltered basin, but the empty sky offers no weather to soften its edges.
        DresSrfLandedRidges* = A ridge cuts across the window like a long raised seam, with one side bright and the other nearly black. The crew's level reference says our landing gear is not as level as the horizon appears.

        DresSrfLandedHighlands* = It is exactly as gray and icy as expected. Not a bit of gray less, not a bit of ice more.

        DresSrfLandedImpactCraters* = Overlapping crater rims crowd the view, their sharp shadows making it difficult to tell which depression is oldest. The cabin's stillness is striking; even the rough terrain provides no sound or wind.

        DresSrfLandedImpactEjecta* = You see scorch marks and are reminded of back home at the KSC.
        DresSrfLandedCanyons* = You bask in the knowledge that you have successfully landed on the Mun. Wait.

        DresInSpaceLow* = It's very gray and icy down there. The VAB team is going to use this to lobby for better gray-resistant landing legs.
        DresInSpaceLow* = This looks too small to be a planet.
        DresInSpaceLow* = You see debris from what looks like an impact...

        DresInSpaceHigh* = You see what appears to be burn marks, and suddenly feel bad for Dres.
        DresInSpaceHigh* = After noticing a large cut across Dres' surface, you wonder if any band-aids in the first aid kit are big enough.
        DresInSpaceHigh* = Watching the planet turn beneath you, you miss home.
    }
}
