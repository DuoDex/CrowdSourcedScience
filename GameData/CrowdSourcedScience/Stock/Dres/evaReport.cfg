@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    %RESULTS
    {
        DresSrfLanded* = You feel like a few smaller rocks should be visible in the distance. However, when you look up, you spot nothing of the sort.

        //DresSrfLandedPoles* =
        DresSrfLandedMidlands* = The midlands are covered in cracked rock and small scree slopes. The Kerbal carefully skirts a loose patch, leaving tracks in the dusty surface.

        DresSrfLandedLowlands* = This is a very low land.

        //DresSrfLandedRidges* =
        //DresSrfLandedHighlands* =
        //DresSrfLandedImpactCraters* =

        DresSrfLandedImpactEjecta* = "It appears that an asteroid has hit very hard here. Where could all of them be coming from?"

        DresSrfLandedCanyons* = For a planet of this size and gravity, there are an awful lot of craters.

        //DresInSpaceLowPoles* =
        DresInSpaceLowMidlands* = Dres's midlands alternate between uneven ridges and shallow depressions. The surface looks chaotic, as if the planet refuses to fit on a map.
        DresInSpaceLowLowlands* = Dres's lowlands appear as broad dark regions between higher ground. From orbit, their connections to the canyons are easier to trace.
        //DresInSpaceLowRidges* =
        DresInSpaceLowHighlands* = Dres's highlands form a rugged band among lower terrain. From outside the craft, their overlapping ridges look like a particularly uncooperative map.
        //DresInSpaceLowImpactCraters* =

        DresInSpaceLowImpactEjecta* = For a minute you think that the burn marks below are the ones of your ship...

        DresInSpaceLowCanyons* = Dres's canyons cut long dark slits across the surface. Their sharp edges stand out from orbit, while mottled patches reveal changes in elevation.

        DresInSpaceHigh* = It's an airless rock floating through space, all alone and lonely. Sniff.
        DresInSpaceHigh* = "If I don't get back in soon, there will be green splotches down there..."
    }
}
