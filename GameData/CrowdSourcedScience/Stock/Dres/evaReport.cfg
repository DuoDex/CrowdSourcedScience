@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    %RESULTS
    {
        DresSrfLanded* = You feel like a few smaller rocks should be visible in the distance. However, when you look up, you spot nothing of the sort.

        DresSrfLandedPoles* = The suited astronaut finds the polar ground firm enough to mark with a boot, yet scattered grit shifts at each step. Dres turns slowly beneath the stark sunlight, leaving nearby shadows sharply divided.
        DresSrfLandedMidlands* = The midlands are covered in cracked rock and small scree slopes. The Kerbal carefully skirts a loose patch, leaving tracks in the dusty surface.

        DresSrfLandedLowlands* = This is a very low land.

        DresSrfLandedRidges* = Standing on the ridge crest, the astronaut sees the ground fall away on both sides, a useful reminder to keep each boot planted. With no air to carry sound, the suit radio is the only voice outside.
        DresSrfLandedHighlands* = The highland footing is uneven, with angular fragments resting on a surface that slopes away more than it first appeared. A long shadow reaches across the astronaut's boots without any breeze to disturb it.
        DresSrfLandedImpactCraters* = At the crater edge, the astronaut traces a crisp rim and a scatter of small fragments leading downslope. The shadowed interior makes a fine view from the suit's safe side of the rim.

        DresSrfLandedImpactEjecta* = "It appears that an asteroid has hit very hard here. Where could all of them be coming from?"

        DresSrfLandedCanyons* = For a planet of this size and gravity, there are an awful lot of craters.

        DresInSpaceLowPoles* = Dres's pole slides beneath the astronaut in free-fall, its pale crater rims interrupted by broad black shadows. The suit tether hangs slack, and the view offers no close detail beyond the passing terrain.
        DresInSpaceLowMidlands* = Dres's midlands alternate between uneven ridges and shallow depressions, a gloriously awkward map that keeps the Kerbal checking the chart twice.
        DresInSpaceLowLowlands* = Dres's lowlands appear as broad dark regions between higher ground. From orbit, their connections to the canyons are easier to trace.
        DresInSpaceLowRidges* = From low orbit the ridge system appears as narrow, bright lines separated by dark slopes. The astronaut drifts above it without feeling a local up or down, while the ground's relief slowly changes the view.
        DresInSpaceLowHighlands* = Dres's highlands form a rugged band among lower terrain. From outside the craft, their overlapping ridges look like a particularly uncooperative map.
        DresInSpaceLowImpactCraters* = The cratered surface passes under the astronaut in silence; overlapping rims cast shadows that reveal their relief better than their color. The largest craters stand out as the terrain rolls by below.

        DresInSpaceLowImpactEjecta* = For a minute you think that the burn marks below are the ones of your ship...

        DresInSpaceLowCanyons* = Dres's canyons cut long dark slits across the surface. Their sharp edges stand out from orbit, while mottled patches reveal changes in elevation.

        DresInSpaceHigh* = It's an airless rock floating through space, all alone and lonely. Sniff.
        DresInSpaceHigh* = "If I don't get back in soon, there will be green splotches down there..."
    }
}
