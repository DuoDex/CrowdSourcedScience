@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    %RESULTS
    {
        DresSrfLanded* = The sensor is on the fritz again.

        DresSrfLandedPoles* = The crew checks the surface reading twice after leveling the lander on Dres's polar ground. Both runs agree within the display's stability, establishing a local reference on this small, airless body.
        DresSrfLandedMidlands* = At midlands elevation, the sensor records brief fluctuations in the field before returning to a steady level. Moving it to a nearby spot changes the curve slightly.
        DresSrfLandedLowlands* = On Dres's lowlands, the gravimeter shows a steady field with a small local variation. The Kerbal secures the instrument and repeats the measurement.
        DresSrfLandedRidges* = On the ridge, the lander sits slightly canted until the crew adjusts one foot. The gravity reading steadies after the correction, and the team keeps the first, less reliable value for comparison.

        DresSrfLandedHighlands* = This data suggests Dres is not as large as the other bodies orbiting the Sun.

        DresSrfLandedImpactCraters* = A brief vibration from the landing leg appears in the first gravimeter trace, then disappears once the craft settles. The follow-up reading is steady beneath Dres's cratered terrain.
        DresSrfLandedImpactEjecta* = The crew takes a second reading after dust from touchdown has settled around the footpads. The new value agrees with the initial average, leaving a clean surface reference among the ejecta.

        DresSrfLandedCanyons* = The gravity is so low, you wonder if Dres is a planet at all!

        DresInSpaceLowPoles* = As Dres's pole rotates under the low-orbit track, the spacecraft's path curves gently toward the small body. The pass adds a closer look at its gravity field than the distant cruise measurements.
        DresInSpaceLowMidlands* = Over Dres's midlands, readings vary slightly between neighboring areas. A repeat pass gives a similar, though not identical, curve.
        DresInSpaceLowLowlands* = The gravimeter registers a modest decrease in the signal above Dres's lowlands. The curve returns to baseline near the region's higher edge.
        DresInSpaceLowRidges* = The low-orbit gravimeter records a gradual change as the craft crosses Dres's ridge longitude. Repeating the track on the next orbit gives mission control a useful check on the regional trend.
        DresInSpaceLowHighlands* = The low-orbit gravimeter records gradual variations over Dres's highlands. The trace changes steadily as the craft crosses the broad terrain.
        DresInSpaceLowImpactCraters* = Dres's overlapping crater fields pass beneath the low-orbit craft as the gravimeter follows the changing track. The reading varies smoothly across the region, providing a broad sample of the small body's mass.
        DresInSpaceLowImpactEjecta* = The spacecraft crosses the ejecta fields at low altitude, and tracking captures a mild along-track change in Dres's pull. The team compares it with the return pass before assigning any regional significance.
        DresInSpaceLowCanyons* = A full low-orbit arc carries the spacecraft along Dres's canyon longitude. The gravimeter's gradual trend, combined with the craft's tracking data, extends the map of this small body's field.

        DresInSpaceHighPoles* = Dres barely tugs at the spacecraft on this high polar arc. The trace changes smoothly from entry to exit, giving navigation a clean whole-body reference against the faint pull.
        DresInSpaceHighMidlands* = As the midlands rotate through view, the gravimeter's long high-orbit arc stays nearly level. That steady baseline helps separate Dres's small attraction from slow instrument drift.
        DresInSpaceHighLowlands* = The lowland pass arrives near the middle of the orbit, where Dres's pull is already faint. Comparing it with the closer arc shows the expected weakening with distance.
        DresInSpaceHighRidges* = The craft crosses the ridge longitude and the gravity trace bends only gradually. At this altitude, the useful result is the smooth regional trend across Dres, not the skyline below.
        DresInSpaceHighHighlands* = During the highland crossing, the spacecraft's predicted track and measured drift remain close. The agreement tightens the broad gravity estimate for this quiet, small world.
        DresInSpaceHighImpactCraters* = A long arc above the cratered hemisphere adds another broad sample to Dres's gravity map. The many rims below blend together in the measurement, while the orbit's gentle curvature remains clear.
        DresInSpaceHighImpactEjecta* = The pass over the ejecta fields produces a gradual change in the craft's motion. It is a regional contribution from Dres as a whole, averaged across far more ground than the scattered blankets.
        DresInSpaceHighCanyons* = Over Dres's canyon longitude, the gravimeter records a smooth pull through the entire pass. The canyon makes a sharp mark in the camera view; here it simply falls within the broader field.
    }
}
