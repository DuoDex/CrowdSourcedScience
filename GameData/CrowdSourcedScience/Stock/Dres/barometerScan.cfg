@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        DresSrfLanded* = On Dres's canyoned surface, the barometer reads zero. The instrument is leveled beside a narrow cut, where the view drops away dramatically and the pressure does not.
        DresSrfLandedPoles* = At Dres's poles, the barometer stays at the vacuum baseline while the instrument slowly warms in sunlight. The raw display drifts for a time, then steadies as the casing reaches equilibrium.
        DresSrfLandedMidlands* = A sharp, short pulse follows the Dres touchdown in the Midlands. It fades without a second event, and the later sample holds at the body's near-vacuum baseline.
        DresSrfLandedLowlands* = The Lowlands reading is quiet and repeatable after the crew removes the inlet cap. Sunlight warms the housing during the run, but compensation keeps the zero from wandering.
        DresSrfLandedRidges* = At the Dres ridges, the barometer is placed on the sunward side of the lander, then shaded for comparison. The tiny offset follows the temperature shift and returns on re-exposure.
        DresSrfLandedHighlands* = The highland instrument shows a near-vacuum result from the first check onward. A nearby capped-port control pins the residual line on the display to sensor offset.
        DresSrfLandedImpactCraters* = A faint transient follows the crew's final adjustment at the impact crater site. Once the supports stop vibrating, the pressure trace settles to its familiar vacuum baseline.
        DresSrfLandedImpactEjecta* = The ejecta site's dusty surface leaves a speck on the inlet guard, briefly slowing the sensor's response. Once the guard is cleared, the next check returns to the same airless reading.
        DresSrfLandedCanyons* = The canyon shadow crosses the Dres station midway through the test. The casing cools and its raw zero shifts, then the reading returns when sunlight reaches the instrument again.

        DresInSpaceLow* = Dres's gray canyons cast sharp shadows below the orbiting probe. The barometer remains at zero throughout the pass: this quiet reading is exactly what vacuum looks like.

        DresInSpaceHigh* = Dres's distant orbit leaves the barometer at its vacuum baseline through the full pass. The tiny offset repeats after each turn, a stable calibration mark for the surface stations.
    }
}
