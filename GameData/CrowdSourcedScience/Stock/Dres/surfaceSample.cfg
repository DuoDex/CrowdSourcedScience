@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
    %RESULTS
    {
        DresSrfLanded* = You take some sand. The color will go great on your sandcastle at home.
        DresSrfLanded* = You find traces of a large number of iron, likely deposited here by impacts over time.
        DresSrfLanded* = The soil is very dark here. You are sure the scientists back on Kerbin will be able to find something interesting about the composition of Dres.

        DresSrfLandedPoles* = The collected polar material is a pale grey mix of fine grains and angular flecks. It clumps under the scoop's pressure, then crumbles apart; the tray preserves a neat record of its texture.
        DresSrfLandedMidlands* = A small midlands scoop contains compacted dust with a few darker chips. Pressing the sample leaves a shallow mark that holds its edge, while the darker grains stand out against the fine dust.
        DresSrfLandedLowlands* = This lowland specimen is finer than the pieces caught on the scoop's rim, with a powdery layer over gritty fragments. The container preserves both fractions for later tests; neither appearance proves a particular composition.
        DresSrfLandedRidges* = The ridge sample includes sharp flakes that resist the scoop and loose dust gathered in the same tray. Its mix of grain sizes gives the crew a close-up look at Dres's fractured terrain.

        DresSrfLandedHighlands* = This grainy dust is not suggesting anything.

        DresSrfLandedImpactCraters* = The soil is very dark here. You are sure the scientists back on Kerbin will be able to find something interesting about the composition of Dres if you can get it back to them.

        DresSrfLandedImpactEjecta* = The grey metallic sand looks nice and shiny, so you make a sandcastle.

        DresSrfLandedCanyons* = Well, THIS is a letdown.
    }
}
