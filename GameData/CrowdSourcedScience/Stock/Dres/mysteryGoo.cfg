@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]
{
    %RESULTS
    {
        DresSrfLanded* = On Dres's surface, the goo stretches into short, sticky strands and clings to the capsule's rim. Tilt the container and it reluctantly slides down.
        DresSrfLandedPoles* = The Goo gathers into a lopsided bead inside its container, then creeps toward the sunlit wall as the polar shadow line crosses the lander. It leaves the cold ground untouched and the crew puzzled.
        DresSrfLandedMidlands* = The sample forms a thin spiral against the vial's bottom, holding its shape while the lander rests on Dres's quiet midlands. A faint tremor from closing the hatch sends one edge wobbling again.
        DresSrfLandedLowlands* = Inside the sealed pod, the Goo spreads into a flat disk and gathers a raised rim, as if imitating the basin surrounding the lander. Its outline changes when the pod is lifted, then slowly settles.

        DresSrfLandedRidges* = The Goo pulls a rabbit out of a hat. You start clapping, before realizing the Goo has neither a hat or a rabbit.

        DresSrfLandedHighlands* = The Goo clings to one side of its chamber in a knobbly patch, then sags into a short tail when the experiment is turned. The highland landing leaves the pod dusty outside, but the sample remains enclosed.
        DresSrfLandedImpactCraters* = A round depression forms in the Goo's center, bordered by a raised ring that survives several gentle taps on the chamber. The sample has produced its own tiny impact crater for the crew to admire.
        DresSrfLandedImpactEjecta* = The Goo separates into several beads and leaves a glossy smear on the chamber floor, echoing the scattered look of nearby ejecta. A careful tilt gathers the beads together, only for them to split again.

        DresSrfLandedCanyons* = The Goo trembles. Is it fear?

        DresInSpaceLow* = In weightlessness above Dres, the goo gathers against one side of the capsule, then slowly flows to the other. A gentle turn of the container sends it creeping back.

        DresInSpaceHigh* = The Goo seems to look for a way to escape.
    }
}
