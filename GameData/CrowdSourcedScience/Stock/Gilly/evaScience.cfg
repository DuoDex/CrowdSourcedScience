@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        GillySrfLanded* = A tiny spring toy hops clear of Gilly's pebbles. The Kerbal has ample time to watch it turn before its slow return; collecting the apparatus takes longer than starting the experiment.
        GillyInSpaceLow* = A tiny bead is released beside Gilly and drifts away from the hand with barely a push. The lumpy moon rotates slowly behind its wandering path.
        GillyInSpaceHigh* = The astronaut gently squeezes a sealed liquid pouch and watches a bubble deform against its clear wall. Gilly provides a distant backdrop as the bubble slowly rounds again when the pressure is released.
    }
}
