@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]
{
    %RESULTS
    {
        PolSrfLanded* = You hear a sneeze in the bay.

        PolSrfLandedPoles* = The exposed test strip curls along one edge while the insulated twin remains flat. Pol's sharp light and shadow transition may drive the difference; no surface material entered the closed rack.

        PolSrfLandedLowlands* = Small pieces of Pol cover the samples.

        PolSrfLandedHighlands* = Some of the samples have shriveled up.

        PolSrfLandedMidlands* = The materails appear to have set up a monarchist govarnment, are are building a very small palace.

        PolInSpaceLow* = Above Pol, the samples drift slowly inside the lab's cartridges, while loose crumbs cling to the wall. A container taps softly as the craft turns.

        PolInSpaceHigh* = A fleck of test powder floats freely inside its sealed vial as the spacecraft turns. The materials rack records how the sample behaves in microgravity, far above Pol's jagged terrain.
    }
}
