@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        PolSrfLanded* = On Pol's jagged yellow ground, the barometer holds at zero. The crew secures its base among the spiky rocks; the needle remains the least lopsided thing nearby.
        PolSrfLandedPoles* = At Pol's rough poles, the mount rocks once against a sharp stone before settling. The pressure trace is unaffected and remains at vacuum; the irregular yellow horizon provides the day's more dramatic movement.
        PolSrfLandedLowlands* = The lowland barometer holds steady after landing dust is brushed from its protective grille. Its inlet finds no appreciable gas, and the quiet result makes a useful baseline for this tiny moon.
        PolSrfLandedHighlands* = A sunlit highland test and a shaded repeat produce the same near-zero pressure on Pol. The difference shows up in the instrument casing, not the gas channel, which stays undisturbed.
        PolSrfLandedMidlands* = The barometer is set down between scattered spikes in Pol's Midlands. After the crew steps away and the lander vibration fades, the trace remains at vacuum baseline with no residual deployment plume.

        PolInSpaceLow* = Pol's yellow, spiky silhouette resembles a pollen grain against space. The barometer reads zero in orbit; no amount of magnification will give its scale an atmosphere to measure.

        PolInSpaceHigh* = In high orbit, the barometer's control volume stays steady while Pol's uneven outline turns below. The tiny moon offers no measurable atmosphere at the spacecraft, so the inlet's quiet baseline is expected.
    }
}
