@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        PolSrfLanded* = A paper flag is planted in Pol's powdery ground. It stays stiff in the airless stillness, while the Kerbal's gentle tug pulls loose a tiny puff of dust.
        PolInSpaceLow* = A bead is rolled between gloved fingers beside Pol. The jagged little moon turns below, its shadowed ridges making the bead's smooth shape look uncanny.
        PolInSpaceHigh* = The astronaut bends a thin foil strip and releases it inside the guarded frame. It springs back with a lasting crease, while a second, gentler bend leaves the comparison strip almost straight against distant yellow Pol.
    }
}
