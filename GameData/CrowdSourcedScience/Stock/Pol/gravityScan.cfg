@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    %RESULTS
    {
        PolSrfLanded* = There are roughly twice as many left-handed negative graviolis as right-handed ones here. That means something. Nobody knows what, though.

        PolSrfLandedPoles* = You notice the gravity scans have been saying 666 over and over again.
        PolSrfLandedPoles* = At the pole, the reading differs slightly from the midlands. The gravimeter records a weak local gradient while the station rests motionless on the rock.

        PolSrfLandedLowlands* = You notice the gravity scans have been saying 666 over and over again.

        PolSrfLandedHighlands* = You notice the gravity scans have been saying 666 over and over again.

        PolSrfLandedMidlands* = You notice the gravity scans have been saying 666 over and over again.
        PolSrfLandedMidlands* = At Pol's midlands site, the gravimeter records a very weak pull. The trace steadies once the supports are secured; a wobbling base could easily overwhelm these small readings.

        PolInSpaceLowPoles* = The polar orbit reveals a separate local bend in the gravity curve. The instrument detects it on each pass over Pol's axis.
        PolInSpaceLowLowlands* = The orbital gravimeter records a broad, smooth curve above Pol's lowlands. Small deviations follow the rounded contour of its surface.
        PolInSpaceLowHighlands* = A low pass over Pol's highlands produces a modest rise and fall in the along-track signal. The jagged skyline moves quickly beneath the craft, but the gravimeter records a smooth regional pattern.
        PolInSpaceLowMidlands* = Over the midlands, the signal varies slightly, highlighting individual irregularities. Most of the local gravity profile remains steady throughout the pass.

        PolInSpaceHighPoles* = From high orbit above Pol's poles, the trace is faint but repeatable on successive passes. The irregular moon's broad field is easier to follow than its spiky outline, which lies below this measurement's detail.
        PolInSpaceHighLowlands* = Pol's lowlands pass under the spacecraft as a weak, gradual change in the field. Comparing opposite sides of the orbit hints at a slight asymmetry in the tiny body's mass distribution.
        PolInSpaceHighHighlands* = The highland pass produces a broad curve rather than separate peaks beneath the spacecraft. Pol is small and lumpy, but high orbit smooths the local relief into a field trend across the whole body.
        PolInSpaceHighMidlands* = Across Pol's midlands, the high-orbit gravimeter traces a gentle variation that repeats on the return arc. Kerbals add the match to the regional model and stop arguing about whether the needle blinked.
        PolSrfLandedLowlands* = On Pol's lowlands, the gravimeter establishes a tiny local weight reference. A captive test mass takes its time returning to its stop, giving the crew a less numerical demonstration of the same weak pull.
        PolSrfLandedHighlands* = The lander sits on a rough highland shelf, and the gravity reading remains consistent as the crew levels the instrument on two footings. The comparison helps separate a tilted setup from the local field.
    }
}
