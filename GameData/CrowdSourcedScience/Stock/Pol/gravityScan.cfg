@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    %RESULTS
    {
        PolSrfLanded* = There are roughly twice as many left-handed negative graviolis as right-handed ones here. That means something. Nobody knows what, though.

        PolSrfLandedPoles* = You notice the gravity scans have been saying 666 over and over again.
        PolSrfLandedPoles* = At the pole, the reading differs slightly from the midlands. The gravimeter records a weak local gradient while the station rests motionless on the rock.

        PolSrfLandedLowlands* = You notice the gravity scans have been saying 666 over and over again.

        PolSrfLandedHighlands* = You notice the gravity scans have been saying 666 over and over again.

        PolSrfLandedMidlands* = You notice the gravity scans have been saying 666 over and over again.
        PolSrfLandedMidlands* = At Pol's midlands site, the gravimeter records a very weak pull. The trace steadies once the supports are secured; a wobbling base could easily overwhelm these small readings.

        PolInSpaceLowPoles* = The polar orbit reveals a separate local bend in the gravity curve. The instrument detects it on each pass over Pol's axis.
        PolInSpaceLowLowlands* = The orbital gravimeter records a broad, smooth curve above Pol's lowlands. Small deviations follow the rounded contour of its surface.
