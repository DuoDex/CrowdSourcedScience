@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    %RESULTS
    {
        PolSrfLanded* = Scientists have confirmed that there is no temperature present on Pol.

        PolSrfLandedPoles* = Pol's polar site stays cold, while nearby sunlit rocks are warmer. Moving the probe between them reveals a small but distinct patchwork of temperatures.
        PolSrfLandedLowlands* = The sensor's exposed face warms under direct light, while the shaded side cools quickly. With no atmosphere to redistribute heat, Pol's lowlands show a strong illumination contrast.

        PolSrfLandedHighlands* = The temperature varies from one rock formation to another. They must each conduct heat differently.

        PolSrfLandedMidlands* = Temperature changes from one rocky ridge to another. The thermometer shows a contrast between smooth dark rocks and loose surface material.

        PolInSpaceLow* = The thermometer wants to come inside because it's cold.
        PolInSpaceLow* = The temperature varies as you fly over the terrain.

        PolInSpaceHigh* = The thermometer warms when its housing faces Kerbol and cools when the craft blocks the light. This high-orbit reading follows radiative exposure rather than any ambient temperature of space.
    }
}
