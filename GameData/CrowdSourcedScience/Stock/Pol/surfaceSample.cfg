@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
    %RESULTS
    {
        PolSrfLanded* = The rock sample you take crumbles into dust in your hand. You put it into your bag.
        PolSrfLanded* = After analyzing some samples, you found phosphoric and sulfuric compounds in the ground. If you bring this back to Kerbin, we can make some matches.
        PolSrfLanded* = You’re fairly certain that Pol isn't, in fact, made of pollen. This will cause quite the stir back home.

        PolSrfLandedPoles* = The polar scoop brings up brittle yellowish flakes mixed with fine angular dust. The sample fractures easily under the probe, but its color and texture alone cannot identify its minerals.

        PolSrfLandedLowlands* = You feel slight irritation as you shove a handful of colorful sand into the storage container.

        PolSrfLandedHighlands* = As you pick up the sample, your eyes start to water. Thinking it would not be good to sneeze in your suit, you put the chunk of surface back down.

        PolSrfLandedMidlands* = A small handful of coarse grit and lighter powder comes from between two midland spires. The grains cling in the scoop's corners, then fall away when tapped; composition remains uncertain.
    }
}
