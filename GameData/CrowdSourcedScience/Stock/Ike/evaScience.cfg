@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        IkeSrfLanded* = A toy cart rolls down an Ike slope after a careful nudge. It gathers speed over loose stones, then tips onto its side beneath Duna's broad disk.
        IkeInSpaceLow* = A striped card is turned edge-on, then face-on beside Ike. Its silhouette changes from a line to a bright rectangle against the gray moon and Duna beyond.
        IkeInSpaceHigh* = A tiny spring pushes two captive sliders apart inside the clear test frame. Their different travel distances are easy to mark against the grid, with dark Ike helping the pale moving pieces stand out.
    }
}
