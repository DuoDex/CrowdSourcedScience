@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]
{
    %RESULTS
    {
        IkeInSpaceLow* = The boom clears Ike's shadow as Duna returns to view. Readings on either side of the crossing are kept separate to test whether the changing background follows the moon or its surroundings.

        IkeInSpaceHigh* = The magnetometer traces a weak, slowly changing field near Ike. Its high-orbit record is a calm magnetic baseline against the surrounding space environment.
    }
}
