@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        IkeSrfLanded* = Between Ike's gray ridges, the barometer remains at zero. Unlike the dusty air around neighboring Duna, nothing here can carry a gust into the inlet.
        IkeSrfLandedPolarLowlands* = Ike's barometer sits at a steady near-vacuum baseline in the polar lowlands. A frost-cold casing warms slowly when sunlight reaches the instrument, and the raw offset follows that change.
        IkeSrfLandedMidlands* = The Midlands station records vacuum after its deployment transient fades. Two checks made before and after a short shadow passage agree once the casing temperature is accounted for.
        IkeSrfLandedEasternMountainRidge* = On Ike's eastern ridge, the probe is turned into the sunlight and then behind the lander. Its tiny zero shift reverses with the shade, while the corrected result remains at vacuum.
        IkeSrfLandedWesternMountainRidge* = The western ridge run begins with a brief pressure pulse from the descending craft. It decays during the crew's wait, leaving the same airless baseline found at the nearby lowland site.
        IkeSrfLandedLowlands* = Ike's lowlands produce a clean vacuum reading after a dust fleck is brushed from the inlet screen. A second sample agrees, and the small offset stays unchanged through the observation.
        IkeSrfLandedSouthEasternMountainRange* = At the southeastern range, the casing cools quickly as the Sun slips behind a high slope. The barometer's zero follows suit, but thermal correction restores the steady near-vacuum result.
        IkeSrfLandedSouthPole* = The polar instrument remains near vacuum through a prolonged dim interval. Its raw offset drifts as the exposed housing cools, then levels out once the lander and sensor share the same temperature.
        IkeSrfLandedCentralMountainRange* = The central range sample is repeated after the lander settles on its uneven footing. Both traces return to baseline, with a small warming-related offset that disappears in the corrected record.

        IkeInSpaceLow* = There's no air in space, silly.
        IkeInSpaceLow* = The atmosphere at Mission Control is tense. The atmosphere outside is nonexistent.
        IkeInSpaceLow* = Ike's gray mountains pass below the probe, with Duna beyond. The barometer stays at zero; its scale has nothing to say about the view.

        IkeInSpaceHigh* = Duna's atmosphere is slightly fuzzy and puffy, but it doesn't extend all the way up to Ike.
        IkeInSpaceHigh* = There's no gas down there, and certainly none up here.
    }
}
