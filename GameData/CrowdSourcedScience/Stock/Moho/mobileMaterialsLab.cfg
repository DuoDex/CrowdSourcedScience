@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]
{
    %RESULTS
    {
        MohoSrfLanded* = You record trace amounts of evaporated samples.

        MohoSrfLandedNorthPole* = The rack's exposed metal strip brightens on its sunward face while the shaded control remains dull. A sharp illumination boundary crosses the plate, revealing how strongly exposure shapes the test.
        MohoSrfLandedNorthernSinkholeRidge* = Fine dust from the lander's deployment settles on the exposed adhesive tab, but not on its capped control. The ridge site's loose surface complicates comparison without entering the sealed lab samples.
        MohoSrfLandedNorthernSinkhole* = A polymer coupon exposed near the sinkhole contracts at its corners, while the protected reference stays flat. The cavity's shade produces a different exposure history than the nearby rim.
        MohoSrfLandedMidlands* = The test coating remains intact on Moho's broad midlands, but the unshielded plate develops a narrow discoloration band. The control helps separate local exposure from a manufacturing flaw.
        MohoSrfLandedWesternLowlands* = The exposed foil curls slightly at one edge as the surface cools; its insulated twin stays flat. The paired strips show Moho's dramatic temperature swing at work.

        MohoSrfLandedCentralLowlands* = The racks holding the samples melt in a highly interesting fashion.

        MohoSrfLandedHighlands* = The samples start sweating.

        MohoSrfLandedMinorCraters* = A loose grain caught on the test surface leaves a short scratch during deployment. The duplicate plate has no such mark, linking the difference to handling over the cratered terrain.

        MohoSrfLandedSouthWesternLowlands* = The materails are currently embroiled in a civil war. You are unable to determine the cause.

        MohoSrfLandedSouthEasternLowlands* = The exposed sample strip becomes brittle at its corners while the sealed reference retains its flexibility. Moho's severe sunlight and shadow cycle is the likely environmental stress.

        MohoSrfLandedCanyon* = The samples have taken well to Moho and are now brown.

        MohoSrfLandedSouthPole* = The shielded panel stays smooth, but the exposed panel's coating pulls into a fine crease after a long shadow interval. The lab records a change in material behavior, not polar geology.

        MohoInSpaceLow* = Some of the samples suggest Moho has a weak magnetic field.

        MohoInSpaceHigh* = The materials have been affected by the intense heat and many of the softer ones have melted entirely.
    }
}
