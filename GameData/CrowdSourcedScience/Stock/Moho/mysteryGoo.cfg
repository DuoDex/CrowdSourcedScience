@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]
{
    %RESULTS
    {
        MohoSrfLanded* = The Goo seems to be trying to escape.

        MohoSrfLandedNorthPole* = The Goo pulls into a narrow, upright tuft inside its jar, then flattens when the lander vibrates. The polar shadow stretches across the ground as the sample stages its own little drama.
        MohoSrfLandedNorthernSinkholeRidge* = A bright bead climbs the Goo's inner wall and pauses at the top, as if testing the ridge outside. The odd shape collapses into a glossy puddle before the crew can compare it twice.
        MohoSrfLandedNorthernSinkhole* = The specimen puckers into a ring with an off-center hollow. The sinkhole's dark interior gives the crew an obvious comparison, though the Goo's shifting surface is plainly its own affair.
        MohoSrfLandedMidlands* = The Goo forms a low, rippled mound and holds the pattern through a full instrument cycle. Sunlight warms one side of its container while Moho's midlands blaze beyond the window.
        MohoSrfLandedWesternLowlands* = A streak of amber color appears through the Goo, then fades as the specimen gathers into a bead. The western lowlands remain stark and dark beyond the window.

        MohoSrfLandedCentralLowlands* = The Goo bakes into a substance suspiciously like hardened bubble gum.

        MohoSrfLandedHighlands* = The Goo's surface rises into several blunt knobs, casting tiny shadows of its own. Outside, Moho's highland relief throws much sharper shadows, a contrast the crew records without explanation.

        MohoSrfLandedMinorCraters* = The Goo is getting very dusty. You wonder if it will sneeze.
        MohoSrfLandedMinorCraters* = The Goo has taken on a nice golden brown.

        MohoSrfLandedSouthWesternLowlands* = The sample slips to one corner of its container and leaves a clear crescent behind. Its slow movement continues despite the lander's steady stance on the broad southwestern plain.
        MohoSrfLandedSouthEasternLowlands* = The Goo wrinkles into a narrow fan and slowly draws itself back together. Its container sits in bright, unfiltered sunlight; the lowland rocks outside remain unchanged and much less interesting.

        MohoSrfLandedCanyon* = The Goo is having way too much fun in the sun.

        MohoSrfLandedSouthPole* = A glossy lump climbs the shaded side of its vial, pauses, then slides down without any visible trigger. The crew logs the polar lighting alongside this small, stubborn mystery.

        MohoInSpaceLow* = The Goo's response to the situation gives insight into Moho's composition and origin... probably.
        MohoInSpaceLow* = It seems that the Goo canister is an excellent fusion reactor here. Oh... it stopped.
        MohoInSpaceLow* = Much of the Goo evaporates, leaving behind small clumps of minerals.

        MohoInSpaceHigh* = You swear you just heard the Goo asking for a cold drink.
        MohoInSpaceHigh* = The Goo wants some tea.
        MohoInSpaceHigh* = The Goo wants to get closer to Moho, its newest friend.
    }
}
