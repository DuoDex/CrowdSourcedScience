@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        MohoSrfLanded* = On Moho's bare ground, the barometer stays at zero. The team checks the casing and shade alignment while the sunlit rocks make the instrument's blank scale feel almost chilly.
        MohoSrfLandedNorthPole* = The north-pole reading begins with a warm casing and a slight zero shift after Moho's strong sunlight. Once the sensor equilibrates, it reports vacuum; the long shadow nearby changes heating, not gas pressure.
        MohoSrfLandedNorthernSinkholeRidge* = On the Northern Sinkhole Ridge, dust from the landing settles across the shield and briefly slows the inlet response. Clearing the guard restores a prompt vacuum reading; the ridge itself contributes no gas signal.
        MohoSrfLandedNorthernSinkhole* = The barometer is lowered into the Northern Sinkhole, where shade cools its housing faster than the exposed lander deck. Thermal compensation removes the offset, leaving the same near-vacuum pressure as the rim.
        MohoSrfLandedMidlands* = Moho's Midlands offer a clear comparison between a sun-facing port and a shaded backup. Their corrected traces agree at vacuum baseline, even as the bright ground sends heat back toward the instrument.
        MohoSrfLandedWesternLowlands* = A panel shadow crosses the Western Lowlands sensor during the run. The casing cools, but the corrected barometer trace remains flat at vacuum baseline, giving a clean pressure record through the lighting change.
        MohoSrfLandedCentralLowlands* = On the Central Lowlands, the team repeats the barometer check after rotating the lander. The inlet's orientation makes no difference: the channel stays at vacuum, with no local gas to disturb the reading.
        MohoSrfLandedHighlands* = The Moho highlands receive direct sunlight while the lander's underside remains dark. Both pressure channels agree after warm-up, showing a stable vacuum baseline across the steep light contrast.
        MohoSrfLandedMinorCraters* = A tiny puff from the landing thrusters crosses the Minor Craters site and briefly nudges the sensor response. The trace quickly returns to vacuum baseline once the exhaust disperses into space.
        MohoSrfLandedSouthWesternLowlands* = The South Western Lowlands reading is repeated after the pressure port's dust cover is removed. No initial pocket of trapped gas escapes; the instrument settles directly to its airless baseline.
        MohoSrfLandedSouthEasternLowlands* = Near Moho's South Eastern Lowlands, a shaded test chamber provides a stable reference while the outer sensor heats in sunlight. Their corrected readings match, and the exposed port finds vacuum.
        MohoSrfLandedCanyon* = The canyon's shaded floor cools the barometer mount, briefly shifting its uncorrected zero. Once the housing stabilizes, the gas channel returns to vacuum baseline, much like the sunlit rim reading.
        MohoSrfLandedSouthPole* = The south-pole sensor alternates between direct light and a long cast shadow as the lander settles. Its pressure reading stays at vacuum in both conditions, while the thermal monitor tracks the larger change.

        MohoInSpaceLow* = Moho's bright sunlit terrain slides beneath the probe. The barometer reads zero; the nearby Sun challenges the thermal hardware, but supplies no air for this instrument to measure.

        MohoInSpaceHigh* = Moho's proximity to Kerbol warms the spacecraft, but the barometer sees no conventional atmosphere in high orbit. A reference cell tracks the instrument's temperature shift and keeps the pressure baseline trustworthy.
    }
}
