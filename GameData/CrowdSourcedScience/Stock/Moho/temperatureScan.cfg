@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    %RESULTS
    {
        MohoSrfLanded* = It's cold. Wait...

        MohoSrfLandedNorthPole* = The thermometer responds quickly as sunlight reaches the north polar site, then cools when the lander's shadow returns. The exposed surface has little atmosphere to moderate that swing.
        MohoSrfLandedNorthernSinkholeRidge* = The ridge by the northern sinkhole heats in sunlight but cools quickly in shadow. The thermometer records a sharp temperature change across the narrow crest.

        MohoSrfLandedNorthernSinkhole* = The thermal gradient data forms a very pretty chart.

        MohoSrfLandedMidlands* = With every fan in the pod on, you don't need a thermometer to tell you it's hot.

        MohoSrfLandedWesternLowlands* = The western lowlands retain intense daytime heat in their dark rocks. Only deep cracks stay cooler between the sunlit slabs.

        MohoSrfLandedCentralLowlands* = Temperature in the shadow seems to be quite low.

        MohoSrfLandedHighlands* = The temperature here is so hot the thermometer has melted entirely. No matter, you send the data back anyway.

        MohoSrfLandedMinorCraters* = The experiment is a success! The team predicted there would be numbers in the data!

        MohoSrfLandedSouthWesternLowlands* = The southwestern lowlands warm almost uniformly under direct sunlight. The craft's shadow leaves a narrow band of rapid cooling on the sensor.
        MohoSrfLandedSouthEasternLowlands* = A sunlit patch warms the sensor housing faster than the shaded patch beside it. The contrast on Moho's open southeastern lowlands shows how directly the surface follows illumination.

        MohoSrfLandedCanyon* = The melted thermometer makes you question the safety of this mission.

        MohoSrfLandedSouthPole* = At the south pole, sunlit rock heats to extreme temperatures. Even in shadow, the sensor still reads intense heat.

        MohoInSpaceLow* = You guessed it would be at least a million billion degrees this close to the Sun... but it isn't.
        MohoInSpaceLow* = This wasn't tested for such temperatures.

        MohoInSpaceHigh* = The instrument's thermal reading follows the spacecraft's changing angle to Kerbol, with a smaller offset when the craft shades it. The probe records radiative heating in vacuum through each turn.
    }
}
