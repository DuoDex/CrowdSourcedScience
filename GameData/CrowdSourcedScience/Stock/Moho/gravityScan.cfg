@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    %RESULTS
    {
        MohoSrfLanded* = Moho's gravity and density implies that a metal-rich core occupies at least 60% of the planet's mass, a figure twice as great as for Kerbin!
        MohoSrfLanded* = The gravitational pull of this planet is high for one of its size. The core must be extremely dense.

        MohoSrfLandedNorthPole* = Detailed scans hint at hollow space in the interior of the planet.

        MohoSrfLandedNorthernSinkholeRidge* = You notice the gravity scans have been saying 666 over and over again.

        MohoSrfLandedNorthernSinkhole* = You notice the gravity scans have been saying 666 over and over again.

        MohoSrfLandedMidlands* = The gravity beneath the instrument shifts almost imperceptibly.

        MohoSrfLandedWesternLowlands* = The gravimeter confirms that the lowlands are large.
        MohoSrfLandedWesternLowlands* = The record from the western lowlands is steady and clear. The gravimeter measures the planet's local gravity as the station's supports press into the rocky surface.

        MohoSrfLandedCentralLowlands* = The gravimeter confirms that the lowlands are large.

        MohoSrfLandedHighlands* = The gravity is stable here.

        MohoSrfLandedMinorCraters* = The sensor is giving odd readings here.

        MohoSrfLandedSouthWesternLowlands* = The gravimeter confirms that the lowlands are large.
        MohoSrfLandedSouthWesternLowlands* = On Moho's southwestern lowlands, the gravimeter stands firmly on the ground. Its reading drifts as the casing heats, so the thermal conditions are logged alongside the gravity data.

        MohoSrfLandedSouthEasternLowlands* = The gravimeter confirms that the lowlands are large.

        MohoSrfLandedCanyon* = The gravity is quite consistent here.

        MohoSrfLandedSouthPole* = Detailed scans hint at hollow spaces in the interior of the planet.

        MohoInSpaceLowNorthPole* = The polar pass shows a pronounced local bend in the gravity signal. It grows toward the northern region, then gradually subsides.
        MohoInSpaceLowNorthernSinkholeRidge* = The ridge by the northern sinkhole produces a narrow rise in the gravity curve. Beyond it, the signal drops sharply, following the terrain's contrast.
        MohoInSpaceLowNorthernSinkhole* = Over the northern sinkhole, the gravimeter records a sharp dip in the signal followed by a gradual return. The anomaly's boundary follows the depression's edges.
        MohoInSpaceLowMidlands* = Over the midlands, the instrument records a steady gravity curve. Only near the region's edge does a gentle slope appear, returning to background.
        MohoInSpaceLowWesternLowlands* = Over the western lowlands, the gravity profile is steady but slightly lower than over the neighboring highlands. The regional boundary appears as a gentle, distinct transition.
        MohoInSpaceLowCentralLowlands* = Above the central lowlands, the gravimeter traces a smooth profile with small local waves. The signal shifts noticeably at the edge of the broad depression.
        MohoInSpaceLowHighlands* = An orbital pass over Moho's highlands records steady local gravity with brief rises over elevated terrain. Repeated peaks follow the mountainous relief.
        MohoInSpaceLowMinorCraters* = Small craters show up on the gravity map as frequent ripples. Individual fluctuations merge into a broad signal above the cratered surface.
        MohoInSpaceLowSouthWesternLowlands* = The southwestern lowlands produce a broad, gradual deviation in the gravity map. The transition to the surrounding highlands appears as a steady slope in the curve.
        MohoInSpaceLowSouthEasternLowlands* = Over the southeastern lowlands, the local gravity signal changes gradually, without sharp jumps. A broad depression appears as a long, shallow bend in the trace.
        //MohoInSpaceLowCanyon* =
        MohoInSpaceLowSouthPole* = The gravimeter notes a distinct bend in the field over the southern polar region. As the craft leaves the area, the signal gradually returns to its usual level.

