@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    %RESULTS
    {
        MohoSrfLanded* = Moho's gravity and density implies that a metal-rich core occupies at least 60% of the planet's mass, a figure twice as great as for Kerbin!
        MohoSrfLanded* = The gravitational pull of this planet is high for one of its size. The core must be extremely dense.

        MohoSrfLandedNorthPole* = Detailed scans hint at hollow space in the interior of the planet.

        MohoSrfLandedNorthernSinkholeRidge* = You notice the gravity scans have been saying 666 over and over again.

        MohoSrfLandedNorthernSinkhole* = You notice the gravity scans have been saying 666 over and over again.

        MohoSrfLandedMidlands* = The gravity beneath the instrument shifts almost imperceptibly.

        MohoSrfLandedWesternLowlands* = The gravimeter confirms that the lowlands are large.
        MohoSrfLandedWesternLowlands* = The record from the western lowlands is steady and clear. The gravimeter measures the planet's local gravity as the station's supports press into the rocky surface.

        MohoSrfLandedCentralLowlands* = The gravimeter confirms that the lowlands are large.

        MohoSrfLandedHighlands* = The gravity is stable here.

        MohoSrfLandedMinorCraters* = The sensor is giving odd readings here.

        MohoSrfLandedSouthWesternLowlands* = The gravimeter confirms that the lowlands are large.
        MohoSrfLandedSouthWesternLowlands* = On Moho's southwestern lowlands, the gravimeter stands firmly on the ground. Its reading drifts as the casing heats, so the thermal conditions are logged alongside the gravity data.

        MohoSrfLandedSouthEasternLowlands* = The gravimeter confirms that the lowlands are large.

        MohoSrfLandedCanyon* = The gravity is quite consistent here.

        MohoSrfLandedSouthPole* = Detailed scans hint at hollow spaces in the interior of the planet.

        MohoInSpaceLowNorthPole* = The polar pass shows a pronounced local bend in the gravity signal. It grows toward the northern region, then gradually subsides.
        MohoInSpaceLowNorthernSinkholeRidge* = The ridge by the northern sinkhole produces a narrow rise in the gravity curve. Beyond it, the signal drops sharply, following the terrain's contrast.
        MohoInSpaceLowNorthernSinkhole* = Over the northern sinkhole, the gravimeter records a sharp dip in the signal followed by a gradual return. The anomaly's boundary follows the depression's edges.
        MohoInSpaceLowMidlands* = Over the midlands, the instrument records a steady gravity curve. Only near the region's edge does a gentle slope appear, returning to background.
        MohoInSpaceLowWesternLowlands* = Over the western lowlands, the gravity profile is steady but slightly lower than over the neighboring highlands. The regional boundary appears as a gentle, distinct transition.
        MohoInSpaceLowCentralLowlands* = Above the central lowlands, the gravimeter traces a smooth profile with small local waves. The signal shifts noticeably at the edge of the broad depression.
        MohoInSpaceLowHighlands* = An orbital pass over Moho's highlands records steady local gravity with brief rises over elevated terrain. Repeated peaks follow the mountainous relief.
        MohoInSpaceLowMinorCraters* = Small craters show up on the gravity map as frequent ripples. Individual fluctuations merge into a broad signal above the cratered surface.
        MohoInSpaceLowSouthWesternLowlands* = The southwestern lowlands produce a broad, gradual deviation in the gravity map. The transition to the surrounding highlands appears as a steady slope in the curve.
        MohoInSpaceLowSouthEasternLowlands* = Over the southeastern lowlands, the local gravity signal changes gradually, without sharp jumps. A broad depression appears as a long, shallow bend in the trace.
        MohoInSpaceLowCanyon* = During the canyon pass, mission control compares the craft's measured along-track drift with its predicted trajectory. The small difference improves the near-Moho gravity solution over several kilometers of track.
        MohoInSpaceLowSouthPole* = The gravimeter notes a distinct bend in the field over the southern polar region. As the craft leaves the area, the signal gradually returns to its usual level.

        MohoInSpaceHighNorthPole* = The north-polar arc registers a steady pull as Moho turns beneath the spacecraft. Combining this long pass with the southern arc will show whether the broad field varies by hemisphere.
        MohoInSpaceHighNorthernSinkholeRidge* = The high-orbit trace begins before the northern ridge reaches the center of the view and continues long after it passes. This extended arc gives a broad, stable gravity sample over Moho.
        MohoInSpaceHighNorthernSinkhole* = The spacecraft crosses the sinkhole longitude at high altitude, where the gravimeter follows a smooth curve. The team adds the full arc to Moho's regional map rather than treating it as a point reading.
        MohoInSpaceHighMidlands* = A long midlands pass shows the same broad pull on both the inbound and outbound legs. That symmetry helps the navigation team check its Moho orbit estimate.
        MohoInSpaceHighWesternLowlands* = The western lowlands slide beneath the spacecraft while the measured orbital drift remains gradual. Cross-checking this segment against the eastern arc improves the model for Moho's large-scale field.
        MohoInSpaceHighCentralLowlands* = From high above Moho, the central lowlands trace a smooth arc beneath the craft. The gravimeter holds a steady broad-field baseline through the pass, giving navigation a clean reference against the Sunward glare.
        MohoInSpaceHighHighlands* = The highland sector crosses the instrument footprint with a gradual rise and fall in the gravity trace. At this distance, the pattern blends the uplands into Moho's wider mass rather than picking out a single ridge.
        MohoInSpaceHighMinorCraters* = Minor craters merge into a faint, even signal during the high-orbit sweep. The crew repeats the pass on the next circuit and gets a similar curve, a useful consistency check for Moho's regional field.
        MohoInSpaceHighSouthWesternLowlands* = Over the southwestern lowlands, the high-orbit reading changes gently as Moho turns below. The smooth track suggests no large regional contrast in this segment, though the survey covers only one arc.
        MohoInSpaceHighSouthEasternLowlands* = The gravimeter logs a broad field across Moho's southeastern lowlands. A comparison with the western arc shows a slight regional offset worth keeping in the map, without tying it to any one surface feature.
        MohoInSpaceHighCanyon* = A long, shallow trend appears as the spacecraft crosses Moho's canyon region. High orbit averages over a wide swath of the world, so the team marks the pattern for a lower pass.
        MohoInSpaceHighSouthPole* = Near Moho's south pole, the instrument records a steady field while the spacecraft passes from bright terrain toward deep shadow. The result offers a useful polar reference for later orbital comparisons.
        MohoSrfLandedNorthernSinkholeRidge* = The ridge-site reading changes slightly when the crew turns the lander across the slope, then returns after the base is leveled. That repeat confirms the orientation correction under Moho's local pull.
        MohoSrfLandedNorthernSinkhole* = At the sinkhole floor, the gravimeter's settling trace is longer than on the firm rim. Once the instrument stops rocking, repeated samples cluster around the same local gravity value.
        MohoSrfLandedSouthEasternLowlands* = A lowland measurement taken before sunrise is repeated after the sensor warms in sunlight. The calibration offset shifts, but the corrected gravity value remains consistent across both runs.
        MohoSrfLandedCentralLowlands* = On Moho's central lowlands, the lander's gravimeter provides a firm local weight reference. The crew repeats the setup after the Sun-facing hardware warms, checking that the stable result survives a temperature change.
    }
}
