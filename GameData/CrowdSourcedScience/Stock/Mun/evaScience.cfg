@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        MunSrfLanded* = A feather and a metal washer are released together above the Mun's dusty ground. They strike side by side: without air resistance, the feather has lost its usual excuse for being late.
        MunInSpaceLow* = A paper model is turned beside the Mun, casting a jagged shadow onto the kit's pale card. Rotating it brings tiny ridges in and out of view, much like the crater rims below.
        MunInSpaceHigh* = A few grains of the kit's test powder cling to a clear wall after it is rubbed with the supplied cloth. Tapping frees some while others stay put, forming a miniature speckled window with the Mun behind it.
    }
}
