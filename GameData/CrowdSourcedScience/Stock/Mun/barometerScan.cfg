@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        MunSrfLanded* = On the Mun, the barometer reads zero beside a field of craters. The crew logs the vacuum baseline, then turns the instrument away from the dust kicked up during setup.
        MunSrfLandedMidlands* = The barometer settles at its vacuum baseline on the Mun's Midlands. During the first minutes, the sunlit casing warms and its tiny offset drifts; after thermal compensation, repeat checks align.
        MunSrfLandedNorthernBasin* = In the Northern Basin, a pressure port briefly shows a faint transient after the lander exhaust lifts dust around the instrument. The trace fades to baseline and stays there through the next cycle.
        MunSrfLandedEastCrater* = East Crater's sensor reads vacuum once its dust cap is removed. The crew repeats the check with the capped port as a control and sees only the instrument's small electronic offset.
        MunSrfLandedNorthwestCrater* = The barometer's zero shifts slightly as the Northwest Crater unit moves from direct sun into shade. A second shaded reading matches the first, tying the change to the warming instrument.
        MunSrfLandedSouthwestCrater* = A glove brushes the open pressure port at Southwest Crater and drives the trace upward for a moment. After the crew withdraws, it returns to the Mun's near-vacuum baseline.
        MunSrfLandedFarsideCrater* = At Farside Crater, the pressure trace remains at baseline during a long observation. The instrument is quiet enough that a small, repeatable thermal offset becomes the main feature of the record.
        MunSrfLandedCanyons* = The canyon site cycles between strong sunlight and a sharp shadow edge. The barometer's casing cools in the shade and its zero shifts slightly, then returns when sunlight reaches the panel.
        MunSrfLandedPolarCrater* = The polar crater station starts cold and warms slowly under scattered sunlight. Its pressure baseline stays near vacuum, while the instrument's offset follows the casing temperature.
        MunSrfLandedPoles* = At the Mun's poles, repeated checks remain at the vacuum baseline as the lander alternates between bright and shaded ground. Thermal correction removes the small drift in the raw trace.
        MunSrfLandedPolarLowlands* = The lowlands reading is repeated after the probe is leveled and the crew's glove is clear of the port. Both runs return the same near-vacuum result, within the instrument's small offset.
        MunSrfLandedHighlands* = The highlands unit registers no surrounding gas above its baseline. Its casing warms faster in direct sun than during the earlier shadow interval, and the offset follows that temperature change.
        MunSrfLandedHighlandCraters* = A short pulse appears as the lander settles among the highland craters, then decays over several minutes. Later samples return to the same vacuum baseline recorded before touchdown.
        MunSrfLandedMidlandCraters* = The barometer remains near vacuum in the Midland Craters. The crew opens and closes a small test chamber connected to the sensor; only the chamber run produces a pressure response.
        MunSrfLandedEastFarsideCrater* = East Farside's shadow line crosses the instrument during the run. The zero drifts with the casing's slow cooling, but the corrected trace remains at the expected airless baseline.
        MunSrfLandedTwinCraters* = The instrument records the same near-vacuum baseline from both sides of the lander at Twin Craters. Moving the port away from the warm engine housing reduces a small repeatable offset.
        MunSrfLandedLowlands* = After landing dust clears, the Lowlands barometer shows a flat baseline through two full checks. A capped-port reading matches the expected instrument offset, confirming the quiet result.
        MunSrfLandedFarsideBasin* = The Farside Basin run spans a long shadow interval. The display's small zero drift tracks the sensor's cooling curve, while corrected samples remain consistent with the Mun's vacuum.

        MunInSpaceLow* = The Mun's cratered disk passes beneath the probe. Its barometer reads zero, as expected above an airless world; the crater count is left to the camera.

        MunInSpaceHigh* = High above the Mun, the barometer stays at its vacuum baseline as the spacecraft crosses the sunlit and dark halves of the orbit. The repeated arc gives a clean reference for the surface runs.
    }
}
