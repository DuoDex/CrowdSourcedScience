@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    %RESULTS
    {
        TyloSrfLanded* = It reads cold until you realize that all of the liquid in the thermometer has just pooled at the bottom.

        TyloSrfLandedMidlands* = On the midlands plain, readings depend on whether the probe faces the Sun or sits behind a rock. No atmosphere moderates the temperature contrast.
        TyloSrfLandedHighlands* = On Tylo's highlands, the sensor cools faster than on exposed low ground; the thin soil barely softens the contrast between sun and shade.
        TyloSrfLandedLowlands* = The lowlands retain heat longer on sunlit patches, while the sensor reading drops as soon as the probe moves into shadow.
        TyloSrfLandedMara* = At Mara, the sensor records lasting warmth in shallow hollows between ridges; nearby exposed ground is already losing heat to space.
        TyloSrfLandedMinorCraters* = Small craters shade the sensor unevenly: readings change slowly on their sunlit rims and fall quickly deep inside the bowls.
        TyloSrfLandedTychoCrater* = In Tycho's basin, readings at the floor are lower than on the sunlit rim; large boulders create narrow cold pockets.
        TyloSrfLandedGalileioCrater* = The sensor in Galileio Crater shows a sharp difference between sunlit rock and shade by the wall; only isolated patches retain heat here.
        TyloSrfLandedGrissomCrater* = In Grissom Crater, readings change as the probe moves from an exposed slope into the shaded basin, where the surface cools much faster.
        TyloSrfLandedGagarinCrater* = At Gagarin Crater, the probe cools when the tall rim blocks sunlight, then warms gradually as the light returns. The trace shows thermal lag at the sensor, not a reading of surrounding air.

        TyloInSpaceLow* = Reflected light from Tylo doesn't appear to transfer much heat to the surrounding space.

        TyloInSpaceHigh* = In high orbit around Tylo, the thermometer swings between sunlight and darkness as the spacecraft turns. The probe measures its own radiative balance; the vacuum around it has no air temperature.
    }
}
