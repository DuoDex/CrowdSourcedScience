@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    %RESULTS
    {
        TyloSrfLanded* = They say the gravity of Tylo adds five pounds.

        TyloSrfLandedMidlands* = If surface composition is of any indication, there is a distinct possibility of finding underground lakes and caverns somewhere around.

        TyloSrfLandedHighlands* = Is it me, or did my spacesuit just get really heavy?

        TyloSrfLandedLowlands* = You try jumping... It isn't very effective

        TyloSrfLandedMara* = Terrain looks like a mix of rocks, ice and dirt. You wonder at the lack of atmosphere.

        TyloSrfLandedMinorCraters* = Each step across the cratered ground takes effort, and little dust rises. Tylo's strong gravity makes even an ordinary hop difficult.
        TyloSrfLandedTychoCrater* = Angular rocks lie on Tycho's floor. Jool hangs above the rim, and my boots press firmly into the ground.
        TyloSrfLandedGalileioCrater* = The astronaut steps onto broken ground near Galileio Crater's sweeping wall. Tylo's strong gravity makes every stride feel weighty, and the curved rim dominates the view.
        TyloSrfLandedGrissomCrater* = In Grissom Crater, the heavy suit presses me into the ground. I step carefully over rocks as the crater rim blocks half the horizon.
        TyloSrfLandedGagarinCrater* = At the base of Gagarin Crater's high wall, the astronaut sees fractured blocks piled against the slope. A measured step tests the footing; the suit provides no help against Tylo's substantial gravity.

        TyloInSpaceLow* = You swear you just found Tylo's missing atmosphere! It's just too bad it floated away before you could grab it.

        TyloInSpaceLowMidlands* = Tylo's midlands are broken into bands of craters and high ground. Jool is visible through the visor, with neighboring moons appearing over the disk's edge.
        TyloInSpaceLowHighlands* = Tylo's highlands stretch into broad, bright slopes. They look almost like Kerbin's mountains through the visor, until you notice the complete absence of a blue atmospheric rim.
        TyloInSpaceLowLowlands* = Tylo's lowlands look smoother than the surrounding mountains. From outside the craft, you can follow the boundary between level ground and the cratered slopes.
        TyloInSpaceLowMara* = Mara is mottled with pale and dark patches of ground. Without an atmosphere to soften the view, every crater rim looks sharply cut into the surface.
        TyloInSpaceLowMinorCraters* = Small craters densely cover this stretch of ground. Their shadows merge into a ripple as the craft passes over the gray plains.
        TyloInSpaceLowTychoCrater* = Tycho Crater stands out with broad, bright terraces. From orbit, rays of ejected material spread across the neighboring plain.
        TyloInSpaceLowGalileioCrater* = Galileio Crater forms a broad dark basin on Tylo's bright surface. A central area lies below, ringed by broken scarps.
        TyloInSpaceLowGrissomCrater* = Grissom Crater is deeper than nearby depressions and casts a sharp shadow. I hold the tether as the craft crosses its rim.
        TyloInSpaceLowGagarinCrater* = In low orbit, the astronaut watches Gagarin Crater rotate beneath the spacecraft. Its tall wall casts a dark wedge across the floor, though the view cannot convey the weight of standing on Tylo.

        TyloInSpaceHigh* = Tylo hangs below the astronaut as a heavily cratered globe, its broad uplands divided by stark shadows. In free fall the suit feels weightless, but Tylo's gravity still governs the orbit.
    }
}
