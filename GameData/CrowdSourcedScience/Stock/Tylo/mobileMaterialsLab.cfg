@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]
{
    %RESULTS
    {
        TyloSrfLanded* = It seems as if the samples have put on some weight.

        TyloSrfLandedMidlands* = The lab exposes a polished strip on Tylo's midlands and keeps a matched strip sealed. The exposed surface acquires a duller finish, while the control helps rule out handling as the cause.

        TyloSrfLandedHighlands* = The samples look very similar to peanut butter. Then you realize this isn't a sample canister and someone got peanut butter all over your materials!

        TyloSrfLandedLowlands* = A flexible sample inside the lab stiffens during exposure on Tylo's lowlands. Its protected twin remains bendable, giving the crew a direct comparison in the moon's strong surface gravity.

        TyloSrfLandedMara* = The samples appear to have started a corporate oligarchy. You're not sure how, but the container is now full of mines and factories.

        TyloSrfLandedMinorCraters* = The lab compares two enclosed grains, one exposed and one protected, beside the crater field. The exposed grains settle into a tighter cluster; no outside soil enters this experiment.
        TyloSrfLandedTychoCrater* = A thin film exposed beside Tycho Crater develops fine creases as it cools. The sealed reference remains smooth, so the crew records a material response rather than a result about crater rocks.
        TyloSrfLandedGalileioCrater* = The lab's exposed coating takes on a faint haze near Galileio Crater, unlike its protected control. The crew gets a clear side-by-side contrast under Tylo's crater-wall shadows.
        TyloSrfLandedGrissomCrater* = Tylo's heavy pull keeps the lab firmly settled while its test fibers are exposed near Grissom Crater. One strand contracts slightly; the sheltered comparison retains its original length.
        TyloSrfLandedGagarinCrater* = The exposed panel inside the materials lab shows a shallow crease after the cold interval by Gagarin Crater. Its covered duplicate is unchanged, a tidy comparison for the crew's log.

        TyloInSpaceLow* = The samples seem to resist movement in the lab, though they are weightless. Crumbs stay in their containers, while free droplets cling to the walls.

        TyloInSpaceHigh* = The metal is metallic, the wood is wooden, the glass is glassy. If Tylo is going change any of this you will have to get closer.
    }
}
