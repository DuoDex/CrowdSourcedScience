@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
    %RESULTS
    {
        TyloSrfLanded* = Some rock samples exhibit high heavy metal content.
        TyloSrfLanded* = The surface seems to be composed of rocks, nickel, a little bit of cobalt and ice.

        TyloSrfLandedMidlands* = In the midlands, the sample breaks into grainy dark fragments with fine pale veins. The edges crumble, but the core holds together.

        TyloSrfLandedHighlands* = You quickly scoop up some white dust. You ran out of condiments three months ago.

        TyloSrfLandedLowlands* = The rock sample is similar to what could be found on the Mun. There seems to be less evidence of volcanic activity, however.

        TyloSrfLandedMara* = The Mara specimen is a mix of dark grains and rough chips, all dry in the tray. The biome's name may suggest otherwise, but this sample is a crisp close-up of Tylo's stony surface.
        TyloSrfLandedMinorCraters* = Near the small craters, impacts have mixed the ground: loose dust hides sharp glassy fragments, and the scoop quickly reaches a compact layer.
        TyloSrfLandedTychoCrater* = Angular fragments of ejected rock enter the sample at Tycho Crater; their fresh breaks are noticeably brighter than the dust-covered surface.
        TyloSrfLandedGalileioCrater* = Fragments gathered near Galileio Crater include sharp-edged pieces and finer dust. Their differing sizes are easy to sort under the work lamp, but composition remains unconfirmed.
        TyloSrfLandedGrissomCrater* = Grissom Crater yields compact grains alongside a few larger angular fragments. The sample feels cohesive when pressed with the tool, though no claim about its mineral identity is warranted.
        TyloSrfLandedGagarinCrater* = The Gagarin Crater collection contains coarse chips that settle quickly beside finer powder. The variety of textures gives the crew plenty to sort beneath the work lamp.
    }
}
