@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    %RESULTS
    {
        TyloSrfLanded* = Confirmed: Getting home will not be easy.

        TyloSrfLandedMidlands* = You notice the gravity scans have been saying 666 over and over again.
        TyloSrfLandedMidlands* = The midlands site gives a stable reading, though Tylo's gravity places a noticeable load on the instrument. The record shows almost no random variation.

        TyloSrfLandedHighlands* = You notice the gravity scans have been saying 666 over and over again.
        TyloSrfLandedHighlands* = The highland site gives a steady reading of strong local gravity. Turning the sensor reveals a slight gradient along the slope.

        TyloSrfLandedLowlands* = You notice the gravity scans have been saying 666 over and over again.
        TyloSrfLandedLowlands* = On the lowlands, the instrument registers strong, steady local gravity. The gravimeter stays put after a light nudge, its feet firmly pressed into the surface.

        TyloSrfLandedMara* = You notice the gravity scans have been saying 666 over and over again.
        TyloSrfLandedMara* = At Mara, the gravimeter records a steady field beneath mottled terrain. Readings shift slightly between pale and dark patches; more than color is needed to explain the difference.

        TyloSrfLandedMinorCraters* = You notice the gravity scans have been saying 666 over and over again.
        TyloSrfLandedMinorCraters* = On the crater ridge, the sensor shows frequent small variations around a strong baseline. Each ledge slightly changes the direction of the force.

        TyloSrfLandedTychoCrater* = Inside Tycho, readings differ between the floor and sloping wall. The instrument records a gradual increase in local gravity nearer the basin's rim.
        TyloSrfLandedGalileioCrater* = At Galileio Crater, Tylo's powerful gravity keeps the lander firmly planted. The crew checks the reading after leveling the sensor on a second foot and gets a close match for this landing site.
        TyloSrfLandedGrissomCrater* = On the floor of Grissom Crater, the gravimeter records Tylo's strong local gravity. The instrument stands firmly on the ground, its housing pressing visibly on the supports.
        TyloSrfLandedGagarinCrater* = The surface instrument reports a strong local pull at Gagarin Crater. A small test mass drops promptly from the crew's hand, and the reading becomes their reference for planning the ascent.

        TyloInSpaceLow* = The gravity here is negative for some reason.

        TyloInSpaceLowMidlands* = Above the midlands, the gravimeter records a strong field with slight ripples. The fluctuations coincide with alternating craters and flat ground.
        TyloInSpaceLowHighlands* = Above Tylo's highlands, the gravimeter records a strong field with broad variations along the scarps. The crew floats beside the display: strong gravity still permits free fall.
        TyloInSpaceLowLowlands* = Above Tylo's lowlands, the gravimeter records a strong, steady field. The craft is falling around the moon, even though everything inside appears weightless.
        TyloInSpaceLowMara* = The pass over Mara shows several shallow gravity variations. The mottled surface is reflected in a gradual sequence of peaks.
        TyloInSpaceLowMinorCraters* = The small craters produce frequent, slight variations against strong local gravity. As the craft moves farther from the surface, the ripples quickly smooth out.
        TyloInSpaceLowTychoCrater* = Over Tycho, the gravimeter notes a broad peak at the rim and a dip over the center. The profile repeats well on another pass.
        TyloInSpaceLowGalileioCrater* = The low pass across Galileio Crater produces a clear along-track curve as the craft approaches and recedes. Comparing it with a higher arc gives the navigation team a practical check on Tylo's pull with distance.
        TyloInSpaceLowGrissomCrater* = Over Grissom Crater, the gravimeter detects a local signal increase near the massive rim. The field then gradually returns to the plains' level.
        TyloInSpaceLowGagarinCrater* = Tylo's field strengthens as the spacecraft descends toward Gagarin Crater, then eases on the outbound leg. The repeated rise and fall follows the orbit cleanly and supports the planned trajectory.


        TyloInSpaceHighMidlands* = From high orbit above the midlands, the gravimeter follows Tylo's large-scale field with a slow, even change around the circuit. The lander team uses this broad curve to refine timing for the next close approach.
        TyloInSpaceHighHighlands* = Tylo's highlands roll beneath the craft, but the high-altitude reading stays broad and gradual. The crew compares the northern and southern arcs to look for a hemispheric trend across the massive moon.
        TyloInSpaceHighLowlands* = A smooth gravity track carries the spacecraft across Tylo's lowlands. The field weakens slightly along the outward leg, giving the team a useful comparison with the sharper readings collected closer in.
        TyloInSpaceHighMara* = Over Mara, the high-orbit instrument records Tylo's broad pull with no special signature from the dark plain. The crew marks the pass as a baseline for the next approach over the cratered uplands.
        TyloInSpaceHighMinorCraters* = The scattered minor craters pass below as the high-orbit gravity trace keeps a broad, steady shape. The data describe Tylo's regional field, while the small bowls serve as visual checkpoints for the route.
        TyloInSpaceHighTychoCrater* = Tycho Crater crosses the window during a high pass, but the gravimeter's curve changes smoothly across the entire arc. The observation is useful for Tylo's broad field map, not a crater-by-crater survey.
        TyloInSpaceHighGalileioCrater* = A wide sweep above Galileio Crater returns a stable gravity profile. The crew compares this high-altitude arc with its low pass to see how Tylo's strong pull changes with distance.
        TyloInSpaceHighGrissomCrater* = Above Grissom Crater, the high-orbit field changes gradually through the arc. The crew saves the curve beside its Tycho and Galileio passes, building a broad regional comparison instead of a list of isolated craters.
        TyloInSpaceHighGagarinCrater* = Gagarin Crater slides under the craft while the distant gravimeter holds a smooth reading. A lower-altitude arc will sharpen the route comparison; this pass supplies the wide-area baseline.
    }
}
