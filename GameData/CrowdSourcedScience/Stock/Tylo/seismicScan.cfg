@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]
{
    %RESULTS
    {
        TyloSrfLanded* = This moon appears to be mostly inactive geologically. You detect little to no activity.

        TyloSrfLandedMidlands* = The test pulse on the midlands plain fades quickly. A faint deep tremor remains in the sensor after the craft stops.

        TyloSrfLandedHighlands* = Periodic quakes roll through the moon, indicating the presence of massive cave networks.

        TyloSrfLandedLowlands* = A faint, sustained rumble passes beneath the lowlands, then the surface falls quiet again. The seismometer records a long signal resembling an echo from a deep cavity.
        TyloSrfLandedMara* = On Mara, a test impact produces scattered clicks over a low echo. Different patches of ground carry the vibration differently, leaving a complicated trace to compare.
        TyloSrfLandedMinorCraters* = The cratered surface breaks the test impact into frequent, short reflections. Afterward, only a low, steady background remains, with no noticeable jolts.
        TyloSrfLandedTychoCrater* = Tycho's floor answers with a strong echo returning from the crater walls. Repeated peaks grow quieter and gradually merge with the background.
        TyloSrfLandedGalileioCrater* = The seismic instrument grips Galileio Crater's fractured ground. A touchdown pulse fades quickly, leaving a quiet trace across the crater floor.
        TyloSrfLandedGrissomCrater* = Grissom Crater's surface carries a short settling vibration through the sensor, then the trace grows still. The passive instrument detects no clear follow-up tremor during this run.
        TyloSrfLandedGagarinCrater* = At Gagarin Crater, the lander's settling is the clearest event in the seismic record. The towering rim sets a dramatic scene while the instrument keeps watch over the quiet ground.
    }
}
