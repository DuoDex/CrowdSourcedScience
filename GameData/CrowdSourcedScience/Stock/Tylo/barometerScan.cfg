@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        TyloSrfLanded* = Tylo gives the landing gear a substantial load and the barometer none at all. The needle rests at zero above the cratered ground: a large moon need not come wrapped in air.
        TyloSrfLandedMidlands* = Tylo's Midlands shake the barometer mount during the final landing bounce. When the platform stops moving, the pressure trace settles to vacuum; the stronger gravity is obvious in the landing gear, not this gauge.
        TyloSrfLandedHighlands* = The highland inlet sits squarely in the open, and its vacuum reading is unchanged when the crew turns the lander toward a ridge. Tylo's heavy pull keeps the mast steady through the comparison.
        TyloSrfLandedLowlands* = Tylo's lowlands give the team a repeatable vacuum baseline after the sensor's protective cap is removed. A control chamber remains sealed at its reference pressure, confirming the inlet is functioning.
        TyloSrfLandedMara* = The barometer on Mara records no gas pressure, despite the biome name suggesting otherwise. A nearby rock shadows the inlet for part of the test, yet its corrected trace stays at vacuum.
        TyloSrfLandedMinorCraters* = Landing dust briefly darkens the Minor Craters inlet screen, so the crew waits for it to settle before repeating the scan. The second trace matches the first: Tylo's surface is airless.
        TyloSrfLandedTychoCrater* = The Tycho Crater measurement begins as sunlight reaches the sensor housing. A small thermal offset vanishes after equilibration, leaving the barometer at vacuum across both sunlit and shaded intervals.
        TyloSrfLandedGalileioCrater* = At Galileio Crater, the port faces down the slope while a duplicate faces the open sky. Both channels settle at vacuum, so the sheltered crater geometry has not trapped measurable gas.
        TyloSrfLandedGrissomCrater* = A vibration from the lander's cooling system appears on the mount channel at Grissom Crater, but the pressure line stays flat. The distinction keeps an equipment tremor from masquerading as a gas pulse.
        TyloSrfLandedGagarinCrater* = The Gagarin Crater barometer is checked after the crew walks clear of the lander. Its trace does not change with the nearby footsteps, and the inlet remains at Tylo's vacuum baseline.

        TyloInSpaceLow* = Tylo's broad, airless surface rolls below the orbiting probe, with Jool nearby. The barometer reads zero; a mighty moon can still leave a vacuum gauge with nothing to report.

        TyloInSpaceHigh* = In high orbit above Tylo, the instrument reads vacuum while the moon's large disk crosses the window. A gradual baseline shift follows the spacecraft's changing sun exposure and disappears after correction.
    }
}
