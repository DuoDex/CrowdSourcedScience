@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        TyloSrfLanded* = A little spring toy is nudged across Tylo's ground. The heavy local gravity keeps its hops short, and it clacks to a stop among the stones.
        TyloInSpaceLow* = A toy ball is let go beside Tylo. It floats freely with the Kerbal, while the moon's rugged limb and Jool fill the background.
        TyloInSpaceHigh* = The astronaut twists a tether between two small captive weights, then lets it unwind. Both begin turning about their shared center, a tidy paired motion set against Tylo's much larger, cratered globe.
    }
}
