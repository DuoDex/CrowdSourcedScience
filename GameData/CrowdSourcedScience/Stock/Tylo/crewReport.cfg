@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
    %RESULTS
    {
        TyloSrfLanded* = You feel surprisingly light.

        TyloSrfLandedMidlands* = From the cabin, Tylo's wide midlands stretch toward a broken upland horizon. The crew can see how the heavy moon's terrain closes in around the lander, and agrees to keep the ramp low.

        TyloSrfLandedHighlands* = The gravity is quite heavy and reminds you of home.

        TyloSrfLandedLowlands* = You can't walk a few meters without your face becoming friends with the surface. It is a little agitating.

        TyloSrfLandedMara* = You congratulate yourself on getting down here without excessive lithobraking. You then begin calculating your delta-V to see if you can get home.

        TyloSrfLandedMinorCraters* = The window looks out over a dense scattering of small craters, each casting a hard-edged shadow. Overlapping rims make the nearby ground look rougher than it appeared during descent.
        TyloSrfLandedTychoCrater* = Tycho Crater's raised rim occupies much of the view, while blocks on the floor sit motionless in the foreground. The crew notes the steep skyline as the main obstacle to a safe departure.
        TyloSrfLandedGalileioCrater* = A wide curved wall of Galileio Crater crosses the cabin window. Broken fragments near the lander provide scale, but the crew has no way to judge their composition from inside.
        TyloSrfLandedGrissomCrater* = Grissom Crater presents a shallow floor beneath a sharper rim, producing a clear step in the horizon. The crew watches the lander settle and feels Tylo's strong pull through the cabin restraints.
        TyloSrfLandedGagarinCrater* = The high wall of Gagarin Crater blocks the far upland from view. From the cabin, the crew can track the shadow line moving across the crater floor as the Sun angle changes.

        TyloInSpaceLow* = You wonder why, despite its size, Tylo doesn't have an atmosphere.
        TyloInSpaceLow* = The crew wonders why they even need to land on this miserable rock.

        TyloInSpaceHigh* = Was this orbit intentional, or is Mission Control hiding something from you?
        TyloInSpaceHigh* = It's like Kerbin, but without all the cool stuff like an atmosphere, oceans, or tectonic plates. Okay, so it's not like Kerbin at all.
    }
}
