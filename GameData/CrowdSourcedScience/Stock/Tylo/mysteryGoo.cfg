@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]
{
    %RESULTS
    {
        TyloSrfLanded* = The Goo has a warm, slightly bluish glow. According to the manual, this means it's either been exposed to some weird particles or it's just happy to be in one piece.

        TyloSrfLandedMidlands* = On Tylo's midlands, the Goo stretches toward the container wall and folds back into a dense knot. The crew turns the canister once; the mass takes its time copying the broad horizon.

        TyloSrfLandedHighlands* = The Goo resembles a green pancake.

        TyloSrfLandedLowlands* = The Goo has no confidence in your ability to return home.

        TyloSrfLandedMara* = The Goo spreads into a dark, flat oval while the crew works above Mara's dry stony plain. It then puckers at the center as if startled by the empty landscape, but stays safely contained.
        TyloSrfLandedMinorCraters* = With small crater rims all around, the Goo forms a cluster of bumps on one side of its clear container. A gentle rotation makes them migrate together into one lumpy ridge.
        TyloSrfLandedTychoCrater* = The Goo climbs the inside of its vessel into a steep arc, pauses, then slumps into a broad pool. The crew remarks that its pose resembles Tycho's rim more than any useful model.
        TyloSrfLandedGalileioCrater* = The Goo pulls into a long curved ridge in its canister and leaves a smooth hollow beside it. The shape persists as Galileio Crater's wall rolls through the view outside.
        TyloSrfLandedGrissomCrater* = The Goo folds into a shallow basin, then turns itself inside out against the clear wall. The crew notes the odd behavior beside Grissom's uneven rim and keeps the lid secured.
        TyloSrfLandedGagarinCrater* = Inside the canister, the Goo draws itself into a tall narrow column, then breaks into two wobbling lobes. It slowly sinks back as Gagarin Crater's wall fills the window.

        TyloInSpaceLow* = The goo glows faintly blue above Tylo. Each maneuver presses it against a different wall; once the engines stop, it slowly regains its shape.

        TyloInSpaceHigh* = In high orbit above Tylo, the Goo forms a tiny sphere and clings to the canister's center. When the craft rotates, it trails a soft tail as the cratered moon turns below.
    }
}
