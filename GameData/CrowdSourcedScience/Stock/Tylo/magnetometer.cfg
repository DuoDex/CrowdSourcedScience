@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]
{
    %RESULTS
    {
        TyloInSpaceLow* = In low orbit, the magnetometer records faint field fluctuations against a noticeable solar-wind background. The signal changes as the craft passes behind Tylo.

        TyloInSpaceHigh* = Tylo's field sensor registers a modest vector change during the pass. The shifting reading adds a small magnetic ripple to the moon's orbital survey.
    }
}
