@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]
{
    %RESULTS
    {
        SunInSpaceLow* = The magnetometer measures the strong interaction between the solar wind and Kerbol's field. The signal direction constantly changes as plasma streams pass.

        SunInSpaceHigh* = The magnetometer tracks a changing field in the heliocentric environment as the spacecraft changes orientation. The reading combines solar influence and vehicle effects; it is not an image of Kerbol.
    }
}
