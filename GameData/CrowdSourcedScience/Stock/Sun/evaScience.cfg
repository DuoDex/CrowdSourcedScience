@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        SunInSpaceLow* = A reflective tile is tilted near Kerbol. Its brilliant glint narrows as it turns edge-on, leaving the kit's shaded card much easier to see. The tiny experiment has acquired a very large light source.
        SunInSpaceHigh* = A small opaque disc is moved between Kerbol and the kit's marked card. Its shadow changes size as the spacing changes; the astronaut reads the card through a shaded view and keeps the star outside the direct line of sight.
    }
}
