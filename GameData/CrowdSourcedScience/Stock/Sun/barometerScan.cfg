@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    %RESULTS
    {
        //SunFlyingLow* =

        //SunFlyingHigh* =

        SunInSpaceLow* = The Sun fills the view while the pressure trace refuses to rise. This close to Kerbol, a barometer is still a vacuum gauge; measuring the solar wind belongs to a different instrument.

        SunInSpaceHigh* = Near Kerbol, the conventional gas-pressure channel remains close to its spacecraft vacuum baseline, while the instrument's radiation shield warms in direct sunlight. The sensor is not a solar-wind detector.
    }
}
