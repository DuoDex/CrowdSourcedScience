@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        DunaSrfLanded* = A folded paper wing is tossed over Duna's red ground. It drops steeply despite its broad shape; this thin air offers much less lift than the practice flights on Kerbin.
        DunaInSpaceLow* = A red ribbon is flicked beside the open kit above Duna. With no air at this altitude, it twists only from the nudge; the thin atmospheric rim remains far below the experiment.
        DunaFlyingLow* = Secured beside the hatch, the astronaut opens a small folding vane into Duna's thin air. It deflects less than in the Kerbin trial, although the test speed must be checked before comparing the two records.
        DunaFlyingHigh* = A short tuft fixed to the outside test frame barely stirs during this high pass over Duna. Turning the frame edge-on quiets it further; the astronaut logs the orientation before folding the kit away.
        DunaInSpaceHigh* = A drop of dye spreads slowly through a sealed water sample while Duna turns beneath the astronaut. Without a rising colored plume, the first changes stay close to the injection point and make a patient little experiment.
    }
}
