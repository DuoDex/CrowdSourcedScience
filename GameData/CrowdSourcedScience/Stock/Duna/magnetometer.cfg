@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]
{
    %RESULTS
    {
        DunaInSpaceLow* = Duna's thin atmospheric rim passes below the boom. Sunlit and nightside readings line up in the log, separating the changing external background from the crust-linked signal.

        DunaInSpaceHigh* = The orbital pass traces a weak, changing magnetic environment near Duna. Its vector shifts along the track without forming a strong global-field pattern.
    }
}
