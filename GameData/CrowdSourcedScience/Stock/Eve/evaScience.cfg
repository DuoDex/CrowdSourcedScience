@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        EveSrfLanded* = A small metal trinket warms in the Kerbal's glove while the kit's paper flag droops in Eve's dense air. The test is brief; the purple horizon shimmers.
        EveSrfSplashed* = A cork and metal washer are lowered to the liquid beside the capsule. The cork stays afloat while the washer sinks from sight; droplets bead on the Kerbal's glove.
        EveInSpaceLow* = A dark card and a bright card are held side by side above Eve. Against the planet's purple disk, their edges nearly vanish in the reflected glare.
    }
}
