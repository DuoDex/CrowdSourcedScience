@EXPERIMENT_DEFINITION:HAS[#id[evaScience]]
{
    %RESULTS
    {
        EveSrfLanded* = A small metal trinket warms in the Kerbal's glove while the kit's paper flag droops in Eve's dense air. The test is brief; the purple horizon shimmers.
        EveSrfSplashed* = A cork and metal washer are lowered to the liquid beside the capsule. The cork stays afloat while the washer sinks from sight; droplets bead on the Kerbal's glove.
        EveInSpaceLow* = A dark card and a bright card are held side by side above Eve. Against the planet's purple disk, their edges nearly vanish in the reflected glare.
        EveFlyingLow* = The kit's enclosed weighted slider strikes its stop as the craft banks through Eve's dense air. The astronaut repeats the test after the turn, when the slider stays firmly at the low end of the tilted track.
        EveFlyingHigh* = An astronaut secured at the hatch compares two hinged tabs in Eve's upper air. The perforated tab deflects less than the solid one; a second run with their positions exchanged preserves the difference.
        EveInSpaceHigh* = Holding the kit's white reference card toward Eve gives it a faint violet cast. Turning it away restores a more neutral appearance, a simple demonstration of how reflected planetary light can color an observation.
    }
}
