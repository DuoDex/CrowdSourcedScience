@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]
{
    %RESULTS
    {
        EveInSpaceLow* = Eve's purple limb sweeps below as the magnetic trace shifts. The log pairs each reading with orbital position and boom orientation, giving the team a tidy map of the signal.

        EveInSpaceHigh* = The magnetometer records a substantial field near Eve, with the vector changing through the orbital pass. The result traces the surrounding magnetic environment, not the color or composition of the planet's surface.
    }
}
